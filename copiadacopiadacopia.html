<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Arrudas - Memórias Sonoras de um Território-Rio</title>

    <style>
        :root {
            --cor-arrudas: #1c4354;
            --cor-fundo: #d8d0bc;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: var(--cor-fundo);
            overflow: hidden;
            user-select: none;
            overscroll-behavior: none;
        }

        /* ==========================================
           1. MODO COMPUTADOR (Desktop > 850px) — INALTERADO
           ========================================== */
        @media (min-width: 851px) {
            .tela-referencia {
                position: absolute;
                left: 0;
                top: 0;
                width: 1920px;
                height: 1080px;
                transform-origin: 0 0;
                z-index: 1;
                background-color: var(--cor-fundo);
                will-change: transform;
            }
            .mobile { display: none; }
        }

        @media (max-width: 850px) {
            .tela-referencia { display: none; }
        }

        /* ELEMENTOS DO PC (e mapa/desenho, compartilhados com o mobile) */
        .mapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 1;
        }
        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }
        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 110%;
            height: 110%;
            z-index: 2;
            pointer-events: none;
            transform: translate(33px, 33px);
            background-image: linear-gradient(45deg, #651b28, var(--cor-arrudas));
            -webkit-mask-image: url("desenho_mapa.svg");
            mask-image: url("desenho_mapa.svg");
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }
        .titulo {
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 20;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 25px 40px;
            cursor: pointer;
            min-width: 420px;
        }
        .titulo h1 { margin: 0; font-size: 38px; font-weight: bold; }
        .titulo p { margin: 10px 0 0; font-size: 18px; }
        .menu-links {
            position: absolute;
            top: 0;
            left: 100%;
            display: none;
            width: 220px;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 15px 20px;
        }
        .titulo.aberto .menu-links { display: block; }
        .menu-links a { display: block; text-decoration: none; color: #222; font-size: 20px; padding: 7px 0; }

        .escute {
            position: absolute;
            left: 960px;
            top: 80px;
            transform: translateX(-50%);
            z-index: 30;
            width: 190px;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(28, 67, 84, 0.20);
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }
        .escute.oculto { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
        .escute img { width: 250px; height: 240px; object-fit: contain; position: relative; top: -62px; }
        .escute span { display: block; position: relative; z-index: 1; margin-top: -125px; color: var(--cor-arrudas); font-size: 35px; font-weight: bold; }

        .aviso-fone {
            position: absolute;
            left: 960px;
            top: 315px;
            transform: translateX(-50%);
            z-index: 31;
            width: 540px;
            padding: 22px 30px;
            background-color: rgba(28, 67, 84, 0.9);
            color: #e8e0cf;
            text-align: center;
            font-size: 24px;
            border-radius: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
        }
        .aviso-fone.visivel { opacity: 1 !important; visibility: visible !important; }

        .audio {
            display: none;
            position: absolute;
            left: 210px;
            top: 400px;
            z-index: 30;
            width: 1500px;
            background: transparent;
        }
        .audio.aberto { display: block; }


        /* ==========================================
           COMPONENTES COMPARTILHADOS DO PLAYER
           ========================================== */
        .player-flex {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: rgba(243, 240, 232, 0.95);
            padding: 20px 40px;
            border-radius: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            width: 100%;
        }
        .botao-play {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: var(--cor-arrudas);
            color: #fff;
            border: none;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .waveform-container {
            flex-grow: 1;
            position: relative;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .waveform-bg {
            position: absolute;
            width: 100%;
            height: 40px;
            background-image: repeating-linear-gradient(90deg, #B79A78, #B79A78 4px, transparent 4px, transparent 9px);
            mask-image: linear-gradient(90deg, #000 15%, #666 40%, #000 70%, #444 100%);
            -webkit-mask-image: linear-gradient(90deg, #000 15%, #666 40%, #000 70%, #444 100%);
        }
        .progresso-onda {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background-color: var(--cor-arrudas);
            opacity: 0.35;
            pointer-events: none;
            border-radius: 4px;
        }
        input[type="range"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
        }
        .fechar-audio {
            position: absolute;
            top: -20px;
            right: 0;
            background: rgba(243, 240, 232, 0.95);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .tempos-info {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            min-width: 130px;
            text-align: right;
        }


        /* ==========================================================
           2. MODO CELULAR (<= 850px) — ARQUITETURA EM 2 CAMADAS

           CAMADA 1 (.fundo-mob): só mapa + desenho, dentro de um "palco"
           1920x1080 escalado em modo COVER (mesma geometria do desktop,
           então mapa e SVG nunca se desalinham). Altura = 100lvh, que
           NÃO muda quando a barra do navegador some/aparece.

           CAMADA 2 (.ui-mob): título, ESCUTE, aviso e player em tamanho
           REAL (px/vw), sem scale. Sempre dentro da tela visível (dvh +
           safe-area). Nada de UI dentro da matriz escalada.
           ========================================================== */
        .mobile { display: none; }

        @media (max-width: 850px) {
            .mobile { display: block; position: fixed; inset: 0; overflow: hidden; background: var(--cor-fundo); }

            /* --- Camada 1: fundo --- */
            .fundo-mob {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;      /* fallback */
                height: 100lvh;     /* estável: ignora a barra do navegador */
                overflow: hidden;
                z-index: 1;
                touch-action: none;
                pointer-events: none;
            }
            .palco-mob {
                position: absolute;
                left: 0;
                top: 0;
                width: 1920px;
                height: 1080px;
                transform-origin: 0 0;
                will-change: transform;
            }

            /* --- Camada 2: interface em tamanho real --- */
            .ui-mob {
                position: fixed;
                inset: 0;
                z-index: 10;
                pointer-events: none;   /* só os filhos clicáveis recebem toque */
                padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            }
            .ui-mob > * { pointer-events: auto; }

            /* Título (menu abre PARA BAIXO, não para a direita) */
            .titulo-mob {
                position: absolute;
                top: calc(env(safe-area-inset-top) + 14px);
                left: 14px;
                max-width: min(80vw, 320px);
                padding: 12px 16px;
                background-color: rgba(243, 240, 232, 0.94);
                cursor: pointer;
            }
            .titulo-mob h1 { margin: 0; font-size: 22px; font-weight: bold; line-height: 1.1; }
            .titulo-mob p { margin: 6px 0 0; font-size: 12px; line-height: 1.3; }
            .menu-links-mob { display: none; padding-top: 6px; }
            .titulo-mob.aberto .menu-links-mob { display: block; }
            .menu-links-mob a { display: block; text-decoration: none; color: #222; font-size: 16px; padding: 8px 0; }

            /* Dock inferior: ESCUTE → (some) → player no mesmo lugar */
            .dock-mob {
                position: absolute;
                left: 0;
                right: 0;
                bottom: calc(env(safe-area-inset-bottom) + 22px);
                display: flex;
                flex-direction: column;
                align-items: center;
                pointer-events: none;
            }
            .dock-mob > * { pointer-events: auto; }

            .escute-mob {
                width: 120px;
                height: 120px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: rgba(28, 67, 84, 0.20);
                border: none;
                border-radius: 50%;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
            }
            .escute-mob.oculto { display: none; }
            .escute-mob img { width: 158px; height: 152px; object-fit: contain; position: relative; top: -39px; }
            .escute-mob span { display: block; position: relative; z-index: 1; margin-top: -79px; color: var(--cor-arrudas); font-size: 22px; font-weight: bold; }

            .aviso-mob {
                position: absolute;
                bottom: 100%;
                margin-bottom: 14px;
                width: min(90vw, 340px);
                padding: 12px 16px;
                background-color: rgba(28, 67, 84, 0.9);
                color: #e8e0cf;
                text-align: center;
                font-size: 14px;
                line-height: 1.35;
                border-radius: 12px;
                opacity: 0;
                visibility: hidden;
                transition: opacity 1.5s ease;
            }
            .aviso-mob.visivel { opacity: 1; visibility: visible; }

            .audio-mob {
                display: none;
                position: relative;
                width: calc(100% - 28px);
                max-width: 560px;
            }
            .audio-mob.aberto { display: block; }
            .audio-mob .fechar-audio { top: -16px; right: 6px; width: 32px; height: 32px; font-size: 20px; }
            .audio-mob .player-flex { padding: 10px 14px; gap: 10px; border-radius: 40px; }
            .audio-mob .botao-play { width: 46px; height: 46px; font-size: 18px; }
            .audio-mob .waveform-container { height: 40px; min-width: 0; }
            .audio-mob .waveform-bg { height: 30px; }
            .audio-mob .tempos-info { font-size: 11px; min-width: 86px; }
        }
    </style>
</head>
<body>

    <!-- ================= DESKTOP HTML (inalterado) ================= -->
    <div class="tela-referencia" id="telaReferencia">
        <div class="mapa">
            <iframe loading="lazy" src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false&dragging=false"></iframe>
            <div class="desenho-arrudas" aria-hidden="true"></div>
        </div>

        <div class="titulo" id="tituloPc">
            <h1>ARRUDAS</h1>
            <p>Memórias Sonoras de um Território-Rio</p>
            <div class="menu-links">
                <a href="sobre.html">Sobre o projeto</a>
            </div>
        </div>

        <button class="escute" id="escutePc">
            <img src="orelha.png" alt="">
            <span>ESCUTE</span>
        </button>

        <div class="aviso-fone" id="avisoFonePc">
            Para uma experiência sonora imersiva, use fones de ouvido.
        </div>

        <div class="audio" id="audioPlayerPc">
            <button class="fechar-audio" id="fecharAudioPc">×</button>
            <div class="player-flex">
                <button class="botao-play" id="botaoPlayPc">▶</button>
                <div class="waveform-container">
                    <div class="waveform-bg"></div>
                    <div class="progresso-onda" id="progressoOndaPc"></div>
                    <input type="range" id="barraProgressoPc" value="0" max="100" step="0.1">
                </div>
                <div class="tempos-info" id="tempoAtualPc">00:00 / 00:00</div>
            </div>
        </div>
    </div>


    <!-- ================= MOBILE HTML (2 camadas) ================= -->
    <div class="mobile" id="containerMobile">

        <!-- Camada 1: mapa + desenho (palco escalado em cover) -->
        <div class="fundo-mob" id="fundoMob">
            <div class="palco-mob" id="palcoMob">
                <div class="mapa">
                    <iframe loading="lazy" src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false&dragging=false"></iframe>
                    <div class="desenho-arrudas" aria-hidden="true"></div>
                </div>
            </div>
        </div>

        <!-- Camada 2: interface em tamanho real -->
        <div class="ui-mob">
            <div class="titulo-mob" id="tituloMob">
                <h1>ARRUDAS</h1>
                <p>Memórias Sonoras de um Território-Rio</p>
                <div class="menu-links-mob">
                    <a href="sobre.html">Sobre o projeto</a>
                </div>
            </div>

            <div class="dock-mob">
                <div class="aviso-mob" id="avisoFoneMob">
                    Para uma experiência sonora imersiva, use fones de ouvido.
                </div>

                <button class="escute-mob" id="escuteMob">
                    <img src="orelha.png" alt="">
                    <span>ESCUTE</span>
                </button>

                <div class="audio-mob" id="audioPlayerMob">
                    <button class="fechar-audio" id="fecharAudioMob">×</button>
                    <div class="player-flex">
                        <button class="botao-play" id="botaoPlayMob">▶</button>
                        <div class="waveform-container">
                            <div class="waveform-bg"></div>
                            <div class="progresso-onda" id="progressoOndaMob"></div>
                            <input type="range" id="barraProgressoMob" value="0" max="100" step="0.1">
                        </div>
                        <div class="tempos-info" id="tempoAtualMob">00:00 / 00:00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- ================= ÁUDIO UNIFICADO ================= -->
    <audio id="meuAudio" preload="auto">
        <source src="https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.m4a" type="audio/mp4">
        Seu navegador não suporta elemento de áudio.
    </audio>

    <script>
        const telaReferencia = document.getElementById("telaReferencia");
        const fundoMob = document.getElementById("fundoMob");
        const palcoMob = document.getElementById("palcoMob");

        const larguraRef = 1920;
        const alturaRef = 1080;

        /* ---- AJUSTES DO MOBILE ----
           MODO_MOB: "cover"   = mapa preenche a tela toda (recorta as laterais)
                     "contain" = mostra o mapa/desenho inteiro (sobram faixas)
           FOCO_X / FOCO_Y: 0 a 1. Qual parte do recorte fica visível.
                     0 = esquerda/topo, 0.5 = centro, 1 = direita/base. */
        const MODO_MOB = "cover";
        const FOCO_X = 0.5;
        const FOCO_Y = 0.5;

        function ajustarTelas() {
            const wWin = window.innerWidth;
            const hWin = window.innerHeight;

            if (wWin > 850) {
                const escala = Math.max(wWin / larguraRef, hWin / alturaRef);
                const posX = (wWin - (larguraRef * escala)) / 2;
                const posY = (hWin - (alturaRef * escala)) / 2;
                telaReferencia.style.transform = `translate(${posX}px, ${posY}px) scale(${escala})`;
            } else {
                // mede a camada de fundo (100lvh): não oscila com a barra do navegador
                const w = fundoMob.clientWidth;
                const h = fundoMob.clientHeight;
                if (!w || !h) return;
                const fx = w / larguraRef, fy = h / alturaRef;
                const escala = MODO_MOB === "contain" ? Math.min(fx, fy) : Math.max(fx, fy);
                const posX = (w - larguraRef * escala) * FOCO_X;
                const posY = (h - alturaRef * escala) * FOCO_Y;
                palcoMob.style.transform = `translate(${posX}px, ${posY}px) scale(${escala})`;
            }
        }

        window.addEventListener("resize", ajustarTelas);
        window.addEventListener("orientationchange", () => setTimeout(ajustarTelas, 300));
        ajustarTelas();

        const tituloPc = document.getElementById("tituloPc");
        const tituloMob = document.getElementById("tituloMob");
        tituloPc.addEventListener("click", (e) => { if (e.target.tagName !== "A") tituloPc.classList.toggle("aberto"); });
        tituloMob.addEventListener("click", (e) => { if (e.target.tagName !== "A") tituloMob.classList.toggle("aberto"); });

        const audio = document.getElementById("meuAudio");

        const escutePc = document.getElementById("escutePc");
        const audioPlayerPc = document.getElementById("audioPlayerPc");
        const avisoFonePc = document.getElementById("avisoFonePc");
        const botaoPlayPc = document.getElementById("botaoPlayPc");
        const barraProgressoPc = document.getElementById("barraProgressoPc");
        const progressoOndaPc = document.getElementById("progressoOndaPc");
        const tempoAtualPc = document.getElementById("tempoAtualPc");
        const fecharAudioPc = document.getElementById("fecharAudioPc");

        const escuteMob = document.getElementById("escuteMob");
        const audioPlayerMob = document.getElementById("audioPlayerMob");
        const avisoFoneMob = document.getElementById("avisoFoneMob");
        const botaoPlayMob = document.getElementById("botaoPlayMob");
        const barraProgressoMob = document.getElementById("barraProgressoMob");
        const progressoOndaMob = document.getElementById("progressoOndaMob");
        const tempoAtualMob = document.getElementById("tempoAtualMob");
        const fecharAudioMob = document.getElementById("fecharAudioMob");

        let avisoTimer = null;

        function formatarTempo(segundos) {
            if (isNaN(segundos)) return "00:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return String(min).padStart(2, "0") + ":" + String(seg).padStart(2, "0");
        }

        escutePc.addEventListener("click", () => {
            escutePc.classList.add("oculto");
            audioPlayerPc.classList.add("aberto");
            avisoFonePc.classList.add("visivel");
            audio.play().then(() => { botaoPlayPc.textContent = "❚❚"; }).catch(e => console.log(e));
            avisoTimer = setTimeout(() => avisoFonePc.classList.remove("visivel"), 15000);
        });

        escuteMob.addEventListener("click", () => {
            escuteMob.classList.add("oculto");
            audioPlayerMob.classList.add("aberto");
            avisoFoneMob.classList.add("visivel");
            audio.play().then(() => { botaoPlayMob.textContent = "❚❚"; }).catch(e => console.log(e));
            avisoTimer = setTimeout(() => avisoFoneMob.classList.remove("visivel"), 15000);
        });

        function alternarPlay() {
            if (audio.paused) {
                audio.play();
                botaoPlayPc.textContent = "❚❚";
                botaoPlayMob.textContent = "❚❚";
            } else {
                audio.pause();
                botaoPlayPc.textContent = "▶";
                botaoPlayMob.textContent = "▶";
            }
        }
        botaoPlayPc.addEventListener("click", alternarPlay);
        botaoPlayMob.addEventListener("click", alternarPlay);

        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                const progresso = (audio.currentTime / audio.duration) * 100;
                barraProgressoPc.value = progresso;
                barraProgressoMob.value = progresso;
                progressoOndaPc.style.width = progresso + "%";
                progressoOndaMob.style.width = progresso + "%";

                const textoTempo = formatarTempo(audio.currentTime) + " / " + formatarTempo(audio.duration);
                tempoAtualPc.textContent = textoTempo;
                tempoAtualMob.textContent = textoTempo;
            }
        });

        barraProgressoPc.addEventListener("input", () => {
            if (audio.duration) audio.currentTime = (barraProgressoPc.value / 100) * audio.duration;
        });
        barraProgressoMob.addEventListener("input", () => {
            if (audio.duration) audio.currentTime = (barraProgressoMob.value / 100) * audio.duration;
        });

        fecharAudioPc.addEventListener("click", () => {
            audio.pause(); audio.currentTime = 0;
            botaoPlayPc.textContent = "▶"; progressoOndaPc.style.width = "0%";
            audioPlayerPc.classList.remove("aberto"); escutePc.classList.remove("oculto");
            avisoFonePc.classList.remove("visivel");
            if (avisoTimer) clearTimeout(avisoTimer);
        });

        fecharAudioMob.addEventListener("click", () => {
            audio.pause(); audio.currentTime = 0;
            botaoPlayMob.textContent = "▶"; progressoOndaMob.style.width = "0%";
            audioPlayerMob.classList.remove("aberto"); escuteMob.classList.remove("oculto");
            avisoFoneMob.classList.remove("visivel");
            if (avisoTimer) clearTimeout(avisoTimer);
        });

        audio.addEventListener("ended", () => {
            botaoPlayPc.textContent = "▶"; botaoPlayMob.textContent = "▶";
            progressoOndaPc.style.width = "0%"; progressoOndaMob.style.width = "0%";
            audio.currentTime = 0;
        });
    </script>
</body>
</html>
