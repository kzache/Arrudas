
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste Waveform — Projeto Arrudas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px;
            background: #f3f0e8;
            color: #222;
            font-family: "Courier New", monospace;
        }

        .painel {
            width: 100%;
            max-width: 900px;
            margin: 10vh auto 0;
            padding: 28px;
            background: rgba(243, 240, 232, 0.75);
            border: 1px solid rgba(133, 89, 60, 0.75);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: normal;
        }

        .descricao {
            margin: 0 0 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        .rotulo {
            margin: 0 0 14px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.04em;
        }

        /* ÁREA DO WAVEFORM */

        .waveform-area {
            position: relative;
            width: 100%;
            min-height: 180px;
            overflow: hidden;
            border: 1px solid #85593c;
            background: #ebe5d9;
            cursor: pointer;
        }

        #waveform {
            width: 100%;
            min-height: 180px;
        }

        /* ESCONDE A PARTE AINDA NÃO REVELADA */

        #mascara {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            background: #ebe5d9;
            pointer-events: none;
            z-index: 5;
            transition: none;
        }

        /* CONTROLES */

        .controles {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-top: 18px;
        }

        #play {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border: 1px solid #222;
            background: #f3f0e8;
            color: #222;
            font-family: "Courier New", monospace;
            font-size: 17px;
            cursor: pointer;
        }

        #play:hover {
            background: #ebe5d9;
        }

        #tempo {
            font-size: 13px;
        }

        #status {
            margin: 16px 0 0;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .painel {
                margin-top: 8vh;
                padding: 18px;
            }

            h1 {
                font-size: 22px;
            }

            .waveform-area,
            #waveform {
                min-height: 140px;
            }
        }
    </style>
</head>

<body>

    <main class="painel">

        <h1>Arrudas</h1>

        <p class="descricao">
            Memórias Sonoras de um Território-Rio
        </p>

        <p class="rotulo">WAVEFORM</p>

        <div
            class="waveform-area"
            id="waveformArea"
            aria-label="Forma de onda do áudio">

            <div id="waveform"></div>

            <div id="mascara"></div>

        </div>

        <div class="controles">

            <button
                id="play"
                type="button"
                aria-label="Reproduzir áudio">
                ▶
            </button>

            <span id="tempo">00:00 / 00:00</span>

        </div>

        <p id="status">
            Preparando o áudio...
        </p>

    </main>

    <script type="module">
        import WaveSurfer from
            'https://cdn.jsdelivr.net/npm/wavesurfer.js@8/dist/wavesurfer.esm.js';

        const audioUrl =
            "https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.wav";

        const waveformArea =
            document.getElementById("waveformArea");

        const mascara =
            document.getElementById("mascara");

        const botaoPlay =
            document.getElementById("play");

        const tempo =
            document.getElementById("tempo");

        const status =
            document.getElementById("status");

        const wavesurfer = WaveSurfer.create({
            container: "#waveform",
            url: audioUrl,

            height: 180,

            waveColor: "#b5a18a",
            progressColor: "#85593c",
            cursorColor: "#222",

            normalize: false,
            barWidth: 2,
            barGap: 2,
            barRadius: 0,

            interact: false
        });

        /* FORMATA O TEMPO */

        function formatarTempo(segundos) {
            const minutos = Math.floor(segundos / 60);
            const segundosRestantes = Math.floor(segundos % 60);

            return (
                String(minutos).padStart(2, "0") + ":" +
                String(segundosRestantes).padStart(2, "0")
            );
        }

        /* REVELA A ONDA CONFORME O ÁUDIO AVANÇA */

        function atualizarRevelacao() {
            const duracao = wavesurfer.getDuration();

            if (!duracao || !Number.isFinite(duracao)) {
                return;
            }

            const atual = wavesurfer.getCurrentTime();

            const proporcao = Math.max(
                0,
                Math.min(1, atual / duracao)
            );

            mascara.style.width =
                ((1 - proporcao) * 100) + "%";

            tempo.textContent =
                formatarTempo(atual) + " / " +
                formatarTempo(duracao);
        }

        /* ÁUDIO CARREGADO */

        wavesurfer.on("ready", function () {
            status.textContent =
                "Áudio pronto. Clique no botão para escutar.";

            atualizarRevelacao();
        });

        /* AVANÇO DA REPRODUÇÃO */

        wavesurfer.on("timeupdate", function () {
            atualizarRevelacao();
        });

        /* BOTÃO PLAY / PAUSA */

        botaoPlay.addEventListener("click", function () {
            wavesurfer.playPause();
        });

        wavesurfer.on("play", function () {
            botaoPlay.textContent = "Ⅱ";
            botaoPlay.setAttribute("aria-label", "Pausar áudio");
            status.textContent = "Reproduzindo...";
        });

        wavesurfer.on("pause", function () {
            botaoPlay.textContent = "▶";
            botaoPlay.setAttribute("aria-label", "Reproduzir áudio");

            status.textContent =
                "Áudio pausado.";
        });

        /* CLICAR NA ONDA PARA ESCOLHER O INSTANTE */

        waveformArea.addEventListener("click", function (event) {
            const retangulo =
                waveformArea.getBoundingClientRect();

            const posicao =
                (event.clientX - retangulo.left) / retangulo.width;

            const proporcao = Math.max(
                0,
                Math.min(1, posicao)
            );

            wavesurfer.seekTo(proporcao);
            atualizarRevelacao();
        });

        /* QUANDO O ÁUDIO TERMINA */

        wavesurfer.on("finish", function () {
            botaoPlay.textContent = "▶";
            botaoPlay.setAttribute("aria-label", "Reproduzir áudio");

            status.textContent =
                "Reprodução concluída.";

            atualizarRevelacao();
        });

        /* ERROS */

        wavesurfer.on("error", function (erro) {
            status.textContent =
                "Não foi possível carregar o áudio. Verifique a conexão e as permissões do arquivo no Cloudflare.";

            console.error(erro);
        });
    </script>

</body>
</html>
