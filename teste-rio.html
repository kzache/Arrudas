<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Mapa Artístico</title>
    <!-- Importa o Leaflet básico -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
        #map { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Configura o Leaflet para trabalhar com uma imagem comum (Plana), em vez do globo terrestre
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 3
        });

        // 2. Define o tamanho interno do mapa na tela
        var limites = [[0, 0], [1000, 1000]];

        // 3. Carrega o seu desenho mapa_00.png como o fundo do mapa
        var meuDesenho = L.imageOverlay('mapa_00.png', limites).addTo(map);

        // 4. Centraliza o zoom no seu desenho
        map.fitBounds(limites);
    </script>

</body>
</html>
