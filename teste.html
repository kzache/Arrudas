
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Arrudas - Teste Mobile-First</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "Courier New", monospace;
            background-color: #d8d0bc;
        }

        /* Container que segura o app inteiro na tela do celular */
        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. MAPA FIXO NO FUNDO */
        .camada-mapa {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        .camada-mapa iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%);
        }

        /* 2. DESENHO VETORIAL SOBREPOSTO */
        .camada-arte {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background-image: linear-gradient(45deg, #651b28, #1c4354);
            -webkit-mask-image: url("desenho_mapa.svg");
            mask-image: url("desenho_mapa.svg");
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: contain;
            mask-size: contain;
        }

        /* 3. INTERFACE DISTRIBUÍDA POR FLEXBOX */
        .camada-ui {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .camada-ui > * {
            pointer-events: auto; 
        }

        .ui-topo {
            background-color: rgba(243, 240, 232, 0.94);
            padding: 12px 18px;
            border-radius: 8px;
            align-self: flex-start;
            max-width: 80%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .ui-topo h1 { margin: 0; font-size: 20px; font-weight: bold; }
        .ui-topo p { margin: 5px 0 0; font-size: 13px; }

        .ui-centro {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .botao-escute {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: rgba(28, 67, 84, 0.25);
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .botao-escute img {
            width: 170px;
            height: 160px;
            object-fit: contain;
            margin-top: -20px;
        }
        .botao-escute span {
            font-size: 22px;
            font-weight: bold;
            color: #1c4354;
            margin-top: -70px;
            z-index: 2;
        }

        .ui-base {
            /* Espaço reservado para o player que vamos encaixar depois */
            height: 50px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- CAMADA 1: O MAPA DE FUNDO -->
        <div class="camada-mapa">
            <iframe src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=true&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false&dragging=true"></iframe>
        </div>

        <!-- CAMADA 2: O DESENHO VETORIAL -->
        <div class="camada-arte" aria-hidden="true"></div>

        <!-- CAMADA 3: A INTERFACE (UI) -->
        <div class="camada-ui">
            
            <header class="ui-topo">
                <h1>ARRUDAS</h1>
                <p>Memórias Sonoras de um Território-Rio</p>
            </header>

            <main class="ui-centro">
                <button class="botao-escute" id="botaoEscute">
                    <img src="orelha.png" alt="Orelha">
                    <span>ESCUTE</span>
                </button>
            </main>

            <footer class="ui-base">
                <!-- Rodapé limpo para o player -->
            </footer>

        </div>

    </div>

</body>
</html>
