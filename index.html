
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Arrudas - Memórias Sonoras de um Território-Rio</title>

    <style>
        :root {
            --cor-arrudas: #1c4354;
            --cor-fundo: #d8d0bc;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: var(--cor-fundo);
            overflow-x: hidden;
        }

        /* ==========================================
           1. MODO COMPUTADOR (Desktop > 850px)
           ========================================== */
        @media (min-width: 851px) {
            body { overflow: hidden; }
            .tela-referencia {
                position: absolute;
                left: 0;
                top: 0;
                width: 1920px;
                height: 1080px;
                transform-origin: 0 0;
                z-index: 1;
                background-color: var(--cor-fundo);
                will-change: transform;
            }
            .mapa-mobile { display: none; }
            .ui-mobile { display: none; }
        }

        @media (max-width: 850px) {
            .tela-referencia { display: none; }
        }

        /* ELEMENTOS DO PC */
        .mapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 1;
        }
        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }
        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 110%;
            height: 110%;
            z-index: 2;
            pointer-events: none;
            transform: translate(33px, 33px);
            background-image: linear-gradient(45deg, #651b28, var(--cor-arrudas));
            -webkit-mask-image: url("desenho_mapa.svg");
            mask-image: url("desenho_mapa.svg");
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }
        .titulo {
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 20;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 25px 40px;
            cursor: pointer;
            min-width: 420px;
        }
        .titulo h1 { margin: 0; font-size: 38px; font-weight: bold; }
        .titulo p { margin: 10px 0 0; font-size: 18px; }
        .menu-links {
            position: absolute;
            top: 0;
            left: 100%;
            display: none;
            width: 220px;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 15px 20px;
        }
        .titulo.aberto .menu-links { display: block; }
        .menu-links a { display: block; text-decoration: none; color: #222; font-size: 20px; padding: 7px 0; }

        .escute {
            position: absolute;
            left: 960px;
            top: 80px;
            transform: translateX(-50%);
            z-index: 30;
            width: 190px;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(28, 67, 84, 0.20);
            border: none;
            border-radius: 50%;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
        .escute.oculto { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
        .escute img { width: 250px; height: 240px; object-fit: contain; position: relative; top: -62px; }
        .escute span { display: block; position: relative; z-index: 1; margin-top: -125px; color: var(--cor-arrudas); }

        .aviso-fone {
            position: absolute;
            left: 960px;
            top: 315px;
            transform: translateX(-50%);
            z-index: 31;
            width: 540px;
            padding: 22px 30px;
            background-color: rgba(28, 67, 84, 0.9);
            color: #e8e0cf;
            text-align: center;
            font-size: 24px;
            border-radius: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
        }
        .aviso-fone.visivel { opacity: 1 !important; visibility: visible !important; }

        .audio {
            display: none;
            position: absolute;
            left: 210px;
            top: 400px;
            z-index: 30;
            width: 1500px;
            background: transparent;
        }
        .audio.aberto { display: block; }


        /* ==========================================
           2. MODO CELULAR (Mobile <= 850px)
           ========================================== */
        @media (max-width: 850px) {
            .mapa-mobile {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 1;
            }
            .mapa-mobile iframe {
                width: 100%;
                height: 100%;
                border: none;
                filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%);
            }

            /* Desenho do Arrudas adaptado para cobrir perfeitamente a tela do celular */
            .desenho-arrudas-mob {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 2;
                pointer-events: none;
                background-image: linear-gradient(45deg, #651b28, var(--cor-arrudas));
                -webkit-mask-image: url("desenho_mapa.svg");
                mask-image: url("desenho_mapa.svg");
                -webkit-mask-repeat: no-repeat;
                mask-repeat: no-repeat;
                -webkit-mask-position: center;
                mask-position: center;
                -webkit-mask-size: contain;
                mask-size: contain;
            }

            .ui-mobile {
                position: relative;
                z-index: 10;
                width: 100vw;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 15px;
                pointer-events: none;
            }
            .ui-mobile > * { pointer-events: auto; }

            .titulo-mob {
                background-color: rgba(243, 240, 232, 0.95);
                padding: 15px;
                border-radius: 8px;
                width: max-content;
                max-width: 90%;
                cursor: pointer;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }
            .titulo-mob h1 { margin: 0; font-size: 20px; font-weight: bold; }
            .titulo-mob p { margin: 5px 0 0; font-size: 13px; }
            .menu-links-mob {
                display: none;
                margin-top: 10px;
                border-top: 1px solid #ccc;
                padding-top: 8px;
            }
            .titulo-mob.aberto .menu-links-mob { display: block; }
            .menu-links-mob a { display: block; text-decoration: none; color: #222; font-size: 15px; padding: 4px 0; }

            .centro-mob {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                margin: auto;
                text-align: center;
                gap: 15px;
            }

            .escute-mob {
                width: 150px;
                height: 150px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: rgba(28, 67, 84, 0.25);
                border: none;
                border-radius: 50%;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            }
            .escute-mob.oculto { display: none; }
            .escute-mob img { width: 170px; height: 160px; object-fit: contain; margin-top: -20px; }
            .escute-mob span { font-size: 22px; font-weight: bold; color: var(--cor-arrudas); margin-top: -70px; z-index: 2; }

            .aviso-fone-mob {
                background-color: rgba(28, 67, 84, 0.9);
                color: #e8e0cf;
                padding: 12px 18px;
                border-radius: 10px;
                font-size: 14px;
                max-width: 320px;
                text-align: center;
                display: none;
            }
            .aviso-fone-mob.visivel { display: block; }

            .audio-mob {
                display: none;
                background-color: rgba(243, 240, 232, 0.96);
                padding: 15px;
                border-radius: 14px;
                width: 100%;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                margin-bottom: 10px;
            }
            .audio-mob.aberto { display: block; }
        }

        /* COMPONENTES COMPARTILHADOS DO PLAYER */
        .player-flex {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: rgba(243, 240, 232, 0.95);
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            width: 100%;
        }
        .botao-play {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: var(--cor-arrudas);
            color: #fff;
            border: none;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .waveform-container {
            flex-grow: 1;
            position: relative;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .waveform-bg {
            position: absolute;
            width: 100%;
            height: 32px;
            background-image: repeating-linear-gradient(90deg, #B79A78, #B79A78 3px, transparent 3px, transparent 7px);
            mask-image: linear-gradient(90deg, #000 15%, #666 40%, #000 70%, #444 100%);
            -webkit-mask-image: linear-gradient(90deg, #000 15%, #666 40%, #000 70%, #444 100%);
        }
        .progresso-onda {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background-color: var(--cor-arrudas);
            opacity: 0.35;
            pointer-events: none;
            border-radius: 4px;
        }
        input[type="range"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
        }
        .fechar-audio {
            position: absolute;
            top: -15px;
            right: 0;
            background: rgba(243, 240, 232, 0.95);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .tempos-info {
            font-size: 14px;
            font-weight: bold;
            color: #222;
            min-width: 90px;
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- ================= DESKTOP HTML ================= -->
    <div class="tela-referencia" id="telaReferencia">
        <div class="mapa">
            <iframe src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false&dragging=false"></iframe>
            <div class="desenho-arrudas" aria-hidden="true"></div>
        </div>

        <div class="titulo" id="tituloPc">
            <h1>ARRUDAS</h1>
            <p>Memórias Sonoras de um Território-Rio</p>
            <div class="menu-links">
                <a href="sobre.html">Sobre o projeto</a>
            </div>
        </div>

        <button class="escute" id="escutePc">
            <img src="orelha.png" alt="">
            <span>ESCUTE</span>
        </button>

        <div class="aviso-fone" id="avisoFonePc">
            Para uma experiência sonora imersiva, use fones de ouvido.
        </div>

        <div class="audio" id="audioPlayerPc">
            <button class="fechar-audio" id="fecharAudioPc">×</button>
            <div class="player-flex">
                <button class="botao-play" id="botaoPlayPc">▶</button>
                <div class="waveform-container">
                    <div class="waveform-bg"></div>
                    <div class="progresso-onda" id="progressoOndaPc"></div>
                    <input type="range" id="barraProgressoPc" value="0" max="100" step="0.1">
                </div>
                <div class="tempos-info" id="tempoAtualPc">00:00 / 00:00</div>
            </div>
        </div>
    </div>


    <!-- ================= MOBILE HTML ================= -->
    <div class="mapa-mobile">
        <iframe src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=true&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false&dragging=true"></iframe>
        <!-- Desenho artístico sobreposto no celular -->
        <div class="desenho-arrudas-mob" aria-hidden="true"></div>
    </div>

    <div class="ui-mobile">
        <div class="titulo-mob" id="tituloMob">
            <h1>ARRUDAS</h1>
            <p>Memórias Sonoras de um Território-Rio</p>
            <div class="menu-links-mob">
                <a href="sobre.html">Sobre o projeto</a>
            </div>
        </div>

        <div class="centro-mob">
            <button class="escute-mob" id="escuteMob">
                <img src="orelha.png" alt="">
                <span>ESCUTE</span>
            </button>
            <div class="aviso-fone-mob" id="avisoFoneMob">
                Para uma experiência sonora imersiva, use fones de ouvido.
            </div>
        </div>

        <div class="audio-mob" id="audioPlayerMob">
            <button class="fechar-audio" id="fecharAudioMob">×</button>
            <div class="player-flex" style="padding: 10px 15px; border-radius: 20px;">
                <button class="botao-play" id="botaoPlayMob" style="width: 45px; height: 45px; font-size: 16px;">▶</button>
                <div class="waveform-container">
                    <div class="waveform-bg"></div>
                    <div class="progresso-onda" id="progressoOndaMob"></div>
                    <input type="range" id="barraProgressoMob" value="0" max="100" step="0.1">
                </div>
                <div class="tempos-info" id="tempoAtualMob" style="font-size: 12px; min-width: 75px;">00:00</div>
            </div>
        </div>
    </div>


    <!-- ================= ÁUDIO ÚNICO COMPARTILHADO ================= -->
    <audio id="meuAudio" preload="auto">
        <source src="https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.m4a" type="audio/mp4">
        Seu navegador não suporta elemento de áudio.
    </audio>

    <script>
        // Lógica de Escala do PC
        const telaReferencia = document.getElementById("telaReferencia");
        let escalaAtual = 1, posX = 0, posY = 0;
        const larguraRef = 1920, alturaRef = 1080;

        function atualizarTransformacao() {
            if (window.innerWidth > 850) {
                telaReferencia.style.transform = `translate(${posX}px, ${posY}px) scale(${escalaAtual})`;
            }
        }
        function inicializarPc() {
            if (window.innerWidth <= 850) return;
            const wWin = window.innerWidth, hWin = window.innerHeight;
            escalaAtual = Math.max(wWin / larguraRef, hWin / alturaRef);
            posY = (hWin - (alturaRef * escalaAtual)) / 2;
            posX = (wWin - (larguraRef * escalaAtual)) / 2;
            atualizarTransformacao();
        }
        window.addEventListener("resize", inicializarPc);
        inicializarPc();

        // Controles de UI (Título Menus)
        const tituloPc = document.getElementById("tituloPc");
        const tituloMob = document.getElementById("tituloMob");
        tituloPc.addEventListener("click", (e) => { if (e.target.tagName !== "A") tituloPc.classList.toggle("aberto"); });
        tituloMob.addEventListener("click", (e) => { if (e.target.tagName !== "A") tituloMob.classList.toggle("aberto"); });

        // Player de Áudio Unificado
        const audio = document.getElementById("meuAudio");
        
        const escutePc = document.getElementById("escutePc");
        const audioPlayerPc = document.getElementById("audioPlayerPc");
        const avisoFonePc = document.getElementById("avisoFonePc");
        const botaoPlayPc = document.getElementById("botaoPlayPc");
        const barraProgressoPc = document.getElementById("barraProgressoPc");
        const progressoOndaPc = document.getElementById("progressoOndaPc");
        const tempoAtualPc = document.getElementById("tempoAtualPc");
        const fecharAudioPc = document.getElementById("fecharAudioPc");

        const escuteMob = document.getElementById("escuteMob");
        const audioPlayerMob = document.getElementById("audioPlayerMob");
        const avisoFoneMob = document.getElementById("avisoFoneMob");
        const botaoPlayMob = document.getElementById("botaoPlayMob");
        const barraProgressoMob = document.getElementById("barraProgressoMob");
        const progressoOndaMob = document.getElementById("progressoOndaMob");
        const tempoAtualMob = document.getElementById("tempoAtualMob");
        const fecharAudioMob = document.getElementById("fecharAudioMob");

        let avisoTimer = null;

        function formatarTempo(segundos) {
            if (isNaN(segundos)) return "00:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return String(min).padStart(2, "0") + ":" + String(seg).padStart(2, "0");
        }

        escutePc.addEventListener("click", () => {
            escutePc.classList.add("oculto");
            audioPlayerPc.classList.add("aberto");
            avisoFonePc.classList.add("visivel");
            audio.play().then(() => { botaoPlayPc.textContent = "❚❚"; }).catch(e => console.log(e));
            avisoTimer = setTimeout(() => avisoFonePc.classList.remove("visivel"), 15000);
        });

        escuteMob.addEventListener("click", () => {
            escuteMob.classList.add("oculto");
            audioPlayerMob.classList.add("aberto");
            avisoFoneMob.classList.add("visivel");
            audio.play().then(() => { botaoPlayMob.textContent = "❚❚"; }).catch(e => console.log(e));
            avisoTimer = setTimeout(() => avisoFoneMob.classList.remove("visivel"), 15000);
        });

        function alternarPlay() {
            if (audio.paused) {
                audio.play();
                botaoPlayPc.textContent = "❚❚";
                botaoPlayMob.textContent = "❚❚";
            } else {
                audio.pause();
                botaoPlayPc.textContent = "▶";
                botaoPlayMob.textContent = "▶";
            }
        }
        botaoPlayPc.addEventListener("click", alternarPlay);
        botaoPlayMob.addEventListener("click", alternarPlay);

        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                const progresso = (audio.currentTime / audio.duration) * 100;
                barraProgressoPc.value = progresso;
                barraProgressoMob.value = progresso;
                progressoOndaPc.style.width = progresso + "%";
                progressoOndaMob.style.width = progresso + "%";
                
                const textoTempo = formatarTempo(audio.currentTime) + " / " + formatarTempo(audio.duration);
                tempoAtualPc.textContent = textoTempo;
                tempoAtualMob.textContent = formatarTempo(audio.currentTime);
            }
        });

        barraProgressoPc.addEventListener("input", () => {
            if (audio.duration) {
                audio.currentTime = (barraProgressoPc.value / 100) * audio.duration;
            }
        });
        barraProgressoMob.addEventListener("input", () => {
            if (audio.duration) {
                audio.currentTime = (barraProgressoMob.value / 100) * audio.duration;
            }
        });

        fecharAudioPc.addEventListener("click", () => {
            audio.pause();
            audio.currentTime = 0;
            botaoPlayPc.textContent = "▶";
            progressoOndaPc.style.width = "0%";
            audioPlayerPc.classList.remove("aberto");
            escutePc.classList.remove("oculto");
            avisoFonePc.classList.remove("visivel");
            if (avisoTimer) clearTimeout(avisoTimer);
        });

        fecharAudioMob.addEventListener("click", () => {
            audio.pause();
            audio.currentTime = 0;
            botaoPlayMob.textContent = "▶";
            progressoOndaMob.style.width = "0%";
            audioPlayerMob.classList.remove("aberto");
            escuteMob.classList.remove("oculto");
            avisoFoneMob.classList.remove("visivel");
            if (avisoTimer) clearTimeout(avisoTimer);
        });

        audio.addEventListener("ended", () => {
            botaoPlayPc.textContent = "▶";
            botaoPlayMob.textContent = "▶";
            progressoOndaPc.style.width = "0%";
            progressoOndaMob.style.width = "0%";
            audio.currentTime = 0;
        });
    </script>
</body>
</html>
