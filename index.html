
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrudas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            color: #222;
        }

        /* MAPA */

        .mapa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }

        /* DESENHO DO ARRUDAS */

        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 122%;
            height: 122%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 1.8s ease-out 1.5s forwards;
            transform: translate(-170px, -1px);
        }

        @keyframes entradaDesenho {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* TÍTULO / MENU — POSIÇÃO ORIGINAL */

        .titulo {
            position: fixed;
            top: 40px;
            left: 30px;
            z-index: 20;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 25px 40px;
            text-align: center;
            min-width: 420px;
            cursor: pointer;
        }

        .titulo h1 {
            margin: 0;
            font-size: 38px;
            font-weight: normal;
        }

        .titulo p {
            margin: 10px 0 0;
            font-size: 18px;
        }

        /* MENU LATERAL */

        .menu-links {
            position: absolute;
            top: 0;
            left: 100%;
            display: none;
            width: 190px;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 15px 20px;
            text-align: left;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 15px;
            padding: 7px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* ESCUTE */

        .escute {
            position: fixed;
            left: 50%;
            top: 36vh;
            transform: translateX(-50%);
            z-index: 30;
            width: 60vw;
            max-width: 900px;
            padding: 16px 20px;
            background-color: rgba(243, 240, 232, 0.72);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            font-family: "Courier New", monospace;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }

        .escute:hover {
            background-color: rgba(235, 229, 217, 0.78);
        }

        /* PAINEL DO ESPECTROGRAMA */

        .audio {
            display: none;
            position: fixed;
            left: 50%;
            top: calc(36vh + 58px);
            transform: translateX(-50%);
            z-index: 30;
            width: 60vw;
            max-width: 900px;
            max-height: calc(64vh - 58px);
            overflow-y: auto;
            background-color: rgba(243, 240, 232, 0.58);
            border: 1px solid rgba(133, 89, 60, 0.75);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            padding: 22px 24px;
        }

        .audio.aberto {
            display: block;
        }

        .player {
            width: 100%;
        }

        /* ÁUDIO NATIVO OCULTO */

        #audio {
            display: none;
        }

        /* ÁREA TÉCNICA DO WAVESURFER */

        .waveform-interno {
            position: absolute;
            width: 100%;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        /* ESPECTROGRAMA */

        .espectrograma-bloco {
            width: 100%;
        }

        .espectrograma-titulo {
            margin: 0 0 14px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.04em;
        }

        .espectrograma-visualizacao {
            position: relative;
            width: 100%;
            cursor: crosshair;
            background: #ebe5d9;
            border: 1px solid #85593c;
            overflow: hidden;
        }

        #espectrograma {
            width: 100%;
            min-height: 320px;
            background: #ebe5d9;
            overflow: hidden;
        }

        /* MÁSCARA: REVELAÇÃO PROGRESSIVA */

        #mascaraEspectrograma {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            background: #ebe5d9;
            pointer-events: none;
            z-index: 4;
            transition: width 0.08s linear;
        }

        /* CURSOR DE REPRODUÇÃO */

        #cursorEspectrograma {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 2px;
            background-color: #85593c;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 2px rgba(243, 240, 232, 0.8);
        }

        #cursorEspectrograma.visivel {
            opacity: 1;
        }

        /* CONTROLES */

        .controles-espectrograma {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
        }

        .botao-play {
            width: 36px;
            height: 36px;
            padding: 0;
            background-color: rgba(243, 240, 232, 0.85);
            border: 1px solid #222;
            font-family: "Courier New", monospace;
            font-size: 15px;
            color: #222;
            cursor: pointer;
            flex-shrink: 0;
        }

        .botao-play:hover {
            background-color: #ebe5d9;
        }

        .tempo {
            font-size: 13px;
            text-align: right;
            flex-shrink: 0;
        }

        #statusEspectrograma {
            margin: 12px 0 0;
            font-size: 11px;
            line-height: 1.4;
            font-weight: normal;
        }

        /* CELULAR */

        @media (max-width: 600px) {
            .titulo {
                top: 25px;
                left: 15px;
                width: calc(100% - 100px);
                min-width: 0;
                padding: 18px 15px;
            }

            .titulo h1 {
                font-size: 27px;
            }

            .titulo p {
                font-size: 16px;
            }

            .menu-links {
                top: 100%;
                left: 0;
                width: 100%;
            }

            .escute {
                left: 15px;
                top: 165px;
                transform: none;
                width: calc(100% - 30px);
                max-width: none;
                font-size: 18px;
            }

            .audio {
                left: 15px;
                top: 215px;
                transform: none;
                width: calc(100% - 30px);
                max-width: none;
                max-height: calc(100vh - 230px);
                padding: 16px;
            }

            #espectrograma {
                min-height: 220px;
            }

            .desenho-arrudas {
                width: 900px;
                top: 45%;
                left: 40%;
            }
        }

        /* TELAS BAIXAS */

        @media (min-width: 601px) and (max-height: 650px) {
            .escute {
                top: 27vh;
            }

            .audio {
                top: calc(27vh + 58px);
                max-height: calc(73vh - 58px);
            }

            #espectrograma {
                min-height: 220px;
            }
        }
    </style>
</head>

<body>

    <!-- MAPA -->

    <div class="mapa">
        <iframe
            allowfullscreen
            allow="geolocation"
            src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false">
        </iframe>

        <img
            class="desenho-arrudas"
            src="desenho_mapa.svg"
            alt="">
    </div>

    <!-- TÍTULO / MENU -->

    <div class="titulo" id="titulo">
        <h1>Arrudas</h1>
        <p>Memórias Sonoras de um Território-Rio</p>

        <div class="menu-links">
            <a href="sobre.html">Sobre o projeto</a>
            <a href="creditos.html">Ficha técnica</a>
        </div>
    </div>

    <!-- ESCUTE -->

    <div class="escute" id="escute">
        ESCUTE
    </div>

    <!-- ESPECTROGRAMA E ÁUDIO -->

    <div class="audio" id="audioPlayer">
        <div class="player">

            <audio
                id="audio"
                preload="metadata"
                controlsList="nodownload noplaybackrate">

                <source
                    src="https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.wav"
                    type="audio/wav">
            </audio>

            <div class="espectrograma-bloco">

                <p class="espectrograma-titulo">
                    ESPECTROGRAMA
                </p>

                <div
                    class="espectrograma-visualizacao"
                    id="espectrogramaVisualizacao">

                    <div
                        id="waveformInterno"
                        class="waveform-interno">
                    </div>

                    <div id="espectrograma"></div>

                    <div id="mascaraEspectrograma"></div>

                    <div id="cursorEspectrograma"></div>

                </div>

                <div class="controles-espectrograma">

                    <button
                        class="botao-play"
                        id="botaoPlay"
                        aria-label="Reproduzir"
                        type="button">
                        ▶
                    </button>

                    <div class="tempo" id="tempo">
                        00:00
                    </div>

                </div>

                <p id="statusEspectrograma">
                    Abra o player para carregar o espectrograma.
                </p>

            </div>
        </div>
    </div>

    <!-- INTERAÇÕES E WAVESURFER -->

    <script type="module">
        import WaveSurfer from
            'https://cdn.jsdelivr.net/npm/wavesurfer.js@8/dist/wavesurfer.esm.js';

        import Spectrogram from
            'https://cdn.jsdelivr.net/npm/wavesurfer.js@8/dist/plugins/spectrogram.esm.js';

        /* ELEMENTOS DO SITE */

        const titulo = document.getElementById("titulo");
        const escute = document.getElementById("escute");
        const audioPlayer = document.getElementById("audioPlayer");

        const audio = document.getElementById("audio");
        const botaoPlay = document.getElementById("botaoPlay");
        const tempo = document.getElementById("tempo");

        const espectrogramaVisualizacao =
            document.getElementById("espectrogramaVisualizacao");

        const mascaraEspectrograma =
            document.getElementById("mascaraEspectrograma");

        const cursorEspectrograma =
            document.getElementById("cursorEspectrograma");

        const statusEspectrograma =
            document.getElementById("statusEspectrograma");

        const audioUrl =
            "https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.wav";

        let wavesurfer = null;
        let espectrogramaIniciado = false;

        /* TÍTULO / MENU */

        titulo.addEventListener("click", function (event) {
            if (event.target.tagName !== "A") {
                titulo.classList.toggle("aberto");
            }
        });

        /* ATUALIZA TEMPO, CURSOR E REVELAÇÃO */

        function atualizarCursor() {
            if (!audio.duration || !Number.isFinite(audio.duration)) {
                return;
            }

            const proporcao = Math.max(
                0,
                Math.min(1, audio.currentTime / audio.duration)
            );

            cursorEspectrograma.style.left =
                (proporcao * 100) + "%";

            mascaraEspectrograma.style.width =
                ((1 - proporcao) * 100) + "%";

            const minutos = Math.floor(audio.currentTime / 60);
            const segundos = Math.floor(audio.currentTime % 60);

            tempo.textContent =
                String(minutos).padStart(2, "0") + ":" +
                String(segundos).padStart(2, "0");
        }

        /* INICIALIZAÇÃO DO WAVESURFER */

        function iniciarEspectrograma() {
            if (espectrogramaIniciado) {
                return;
            }

            espectrogramaIniciado = true;

            statusEspectrograma.textContent =
                "Carregando áudio e espectrograma...";

            try {
                wavesurfer = WaveSurfer.create({
                    container: "#waveformInterno",
                    media: audio,
                    url: audioUrl,
                    height: 1,
                    waveColor: "#b5a18a",
                    progressColor: "#85593c",
                    cursorColor: "#222",
                    normalize: false
                });

                wavesurfer.registerPlugin(
                    Spectrogram.create({
                        container: "#espectrograma",
                        height: 320,
                        labels: true,
                        splitChannels: false,
                        colorMap: "gray",
                        rendering: "windowed"
                    })
                );

                wavesurfer.on("ready", function () {
                    statusEspectrograma.textContent =
                        "Áudio carregado. Você já pode escutar.";

                    cursorEspectrograma.classList.add("visivel");

                    /* Começa com o espectrograma encoberto */
                    if (audio.currentTime === 0) {
                        mascaraEspectrograma.style.transition = "none";
                        mascaraEspectrograma.style.width = "100%";

                        requestAnimationFrame(function () {
                            mascaraEspectrograma.style.transition =
                                "width 0.08s linear";
                        });
                    }

                    atualizarCursor();
                });

                wavesurfer.on("error", function (erro) {
                    statusEspectrograma.textContent =
                        "Não foi possível carregar o espectrograma. " +
                        "Verifique a conexão e o acesso ao áudio.";

                    console.error("Erro no WaveSurfer:", erro);
                });

            } catch (erro) {
                statusEspectrograma.textContent =
                    "Erro ao iniciar o espectrograma. Consulte o console.";

                console.error("Erro ao iniciar o WaveSurfer:", erro);
            }
        }

        /* ESCUTE: ABRIR E FECHAR */

        escute.addEventListener("click", function () {
            audioPlayer.classList.toggle("aberto");

            if (audioPlayer.classList.contains("aberto")) {
                requestAnimationFrame(function () {
                    iniciarEspectrograma();
                });
            }
        });

        /* PLAY / PAUSA */

        botaoPlay.addEventListener("click", async function () {
            if (audio.paused) {
                try {
                    if (!espectrogramaIniciado) {
                        iniciarEspectrograma();
                    }

                    await audio.play();

                } catch (erro) {
                    console.error("Erro ao reproduzir o áudio:", erro);

                    statusEspectrograma.textContent =
                        "O áudio não conseguiu iniciar. Tente novamente.";
                }
            } else {
                audio.pause();
            }
        });

        /* ATUALIZA TEMPO E LINHA DURANTE A REPRODUÇÃO */

        audio.addEventListener("timeupdate", atualizarCursor);
        audio.addEventListener("loadedmetadata", atualizarCursor);

        /* CLICAR NO ESPECTROGRAMA PARA NAVEGAR NO ÁUDIO */

        espectrogramaVisualizacao.addEventListener(
            "click",
            function (event) {
                if (
                    !audio.duration ||
                    !Number.isFinite(audio.duration)
                ) {
                    return;
                }

                const area =
                    espectrogramaVisualizacao.getBoundingClientRect();

                const posicao = event.clientX - area.left;

                const proporcao = Math.max(
                    0,
                    Math.min(1, posicao / area.width)
                );

                audio.currentTime = proporcao * audio.duration;

                atualizarCursor();
            }
        );

        /* ESTADO DO BOTÃO */

        audio.addEventListener("play", function () {
            botaoPlay.textContent = "Ⅱ";
            botaoPlay.setAttribute("aria-label", "Pausar");
        });

        audio.addEventListener("pause", function () {
            botaoPlay.textContent = "▶";
            botaoPlay.setAttribute("aria-label", "Reproduzir");
        });

        audio.addEventListener("ended", function () {
            botaoPlay.textContent = "▶";
            botaoPlay.setAttribute("aria-label", "Reproduzir");
        });
    </script>

</body>
</html>
