```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto Arrudas</title>

    <style>

        /* Configurações gerais da página */

        body {
            margin: 0;
            padding: 0;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: #f3f0e8;
        }


        /* Menu */

        nav {
            position: absolute;
            top: 30px;
            right: 40px;
        }

        nav a {
            margin-left: 25px;
            text-decoration: none;
            color: #222;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* Conteúdo principal */

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 30px 60px;
        }


        /* Título */

        h1 {
            text-align: center;
            font-size: 42px;
            font-weight: normal;
            margin-bottom: 10px;
        }


        /* Subtítulo */

        .subtitulo {
            text-align: center;
            font-size: 20px;
            margin-bottom: 60px;
        }


        /* Vídeo */

        .video {
            display: flex;
            justify-content: center;
        }

        .video iframe {
            width: 80%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            border: none;
        }


        /* Ajustes para telas pequenas */

        @media (max-width: 600px) {

            nav {
                position: static;
                text-align: center;
                padding-top: 25px;
            }

            nav a {
                margin: 0 10px;
            }

            main {
                padding: 50px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitulo {
                font-size: 18px;
                margin-bottom: 40px;
            }

            .video iframe {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- MENU -->

    <nav>
        <a href="sobre.html">Sobre o projeto</a>
        <a href="creditos.html">Créditos</a>
    </nav>


    <!-- CONTEÚDO PRINCIPAL -->

    <main>

        <h1>PROJETO ARRUDAS</h1>

        <p class="subtitulo">
            Uma investigação sonora sobre o Ribeirão Arrudas
        </p>


        <!-- VÍDEO -->

        <div class="video">

            <!-- O link do vídeo será colocado aqui -->

            <iframe
                src="COLOQUE-AQUI-O-LINK-DO-VIDEO"
                title="Projeto Arrudas"
                allowfullscreen>
            </iframe>

        </div>

    </main>


</body>

</html>
