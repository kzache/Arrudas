
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrudas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier Prime", monospace;
            color: #222;
            background-color: #e8e0cf;
        }

        /* MAPA */

        .mapa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }

        /* CARREGAMENTO DO TÍTULO E DO ESCUTE */

        .titulo,
        .escute {
            opacity: 1;
            transition: opacity 1.8s ease-out;
        }

        body.carregando .titulo,
        body.carregando .escute {
            opacity: 0;
            visibility: hidden;
            transition: none;
        }

        /* DESENHO DO ARRUDAS */

        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 122%;
            height: 122%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 2s ease-out 2.2s forwards;
            transform: translate(-170px, -1px);
        }

        @keyframes entradaDesenho {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* TÍTULO / MENU — POSIÇÃO ORIGINAL */

        .titulo {
            position: fixed;
            top: 40px;
            left: 30px;
            z-index: 20;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 25px 40px;
            text-align: center;
            min-width: 420px;
            cursor: pointer;
        }

        .titulo h1 {
            margin: 0;
            font-size: 38px;
            font-weight: bold;
        }

        .titulo p {
            margin: 10px 0 0;
            font-size: 18px;
        }

        /* MENU LATERAL */

        .menu-links {
            position: absolute;
            top: 0;
            left: 100%;
            display: none;
            width: 190px;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 15px 20px;
            text-align: left;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 20px;
            padding: 7px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* ESCUTE */
        .escute {

        position: fixed;
        left: 50%;
        top: 12vh;
        transform: translateX(-50%);
        z-index: 30;
        width: 340px;
        height: 340px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        gap: 0;
        background: transparent;
        border: 1px solid #222;
        border-radius: 50%;
        font-size: 30px;
        font-weight: bold;
        text-align: center;
        cursor: pointer;
        }
        
        .escute img {
            display: block;
            width: 280px;
            height: 270px;
            object-fit: contain;
        }
        
        .escute span {
            display: block;
            position: relative;
            z-index: 1;
            margin-top: -15px;
        }
        
        .escute:hover {
            background: transparent;
        }
            
        /* PAINEL DE ÁUDIO — SEM CAIXA */

        .audio {
            display: none;
            position: fixed;
            left: 50%;
            top: 36vh;
            transform: translateX(-50%);
            z-index: 30;
            width: 92vw;
            max-width: 1500px;
            max-height: calc(64vh - 58px);
            overflow-y: auto;
            background: transparent;
            border: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 22px 24px;
        }

        .audio.aberto {
            display: block;
        }

        /* CONTROLES OCULTOS ATÉ A ONDA ESTAR PRONTA */

        .fechar-audio,
        .botao-play,
        .tempo {
            visibility: hidden;
        }

        .audio.pronto .fechar-audio,
        .audio.pronto .botao-play,
        .audio.pronto .tempo {
            visibility: visible;
        }

        /* BOTÃO PARA FECHAR O PAINEL */

        .fechar-audio {
            position: absolute;
            top: 4px;
            right: 10px;
            z-index: 10;
            border: none;
            background: transparent;
            padding: 0;
            color: #222;
            font-size: 25px;
            line-height: 1;
            cursor: pointer;
        }

        .fechar-audio:hover {
            color: #85593c;
        }

        .player {
            width: 100%;
        }

        /* ONDA — MAIS ALTA, COM APARIÇÃO SUAVE */

        .waveform-bloco {
            width: 100%;
        }

        .waveform-visualizacao {
            position: relative;
            width: 100%;
            height: 280px;
            cursor: pointer;
            background: transparent;
            border: none;
            overflow: hidden;
        }

        #waveform {
            width: 100%;
            height: 280px;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }

        #waveform.carregado {
            opacity: 1;
        }

        /* BOTÃO PLAY SOBREPOSTO AO CENTRO DA ONDA */

        .botao-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(243, 240, 232, 0.75);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            font-size: 21px;
            color: #222;
            cursor: pointer;
        }

        .botao-play:hover {
            background: rgba(243, 240, 232, 0.95);
        }

        /* CONTADOR */

        .controles-waveform {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 14px;
        }

        .tempo {
            font-size: 13px;
            text-align: right;
            flex-shrink: 0;
        }

        /* CELULAR */

        @media (max-width: 600px) {
            .titulo {
                top: 25px;
                left: 15px;
                width: calc(100% - 100px);
                min-width: 0;
                padding: 18px 15px;
            }

            .titulo h1 {
                font-size: 40px;
            }

            .titulo p {
                font-size: 25px;
            }

            .menu-links {
                top: 100%;
                left: 0;
                width: 100%;
            }

            .escute {
                left: 50%;
                top: 165px;
                transform: translateX(-50%);
                width: 190px;
                height: 180px;
                max-width: none;
                font-size: 18px;
            }

            .audio {
                left: 15px;
                top: 165px;
                transform: none;
                width: calc(100% - 30px);
                max-width: none;
                max-height: calc(100vh - 230px);
                padding: 30px 16px 16px;
            }

            .waveform-visualizacao,
            #waveform {
                height: 220px;
            }

            .botao-play {
                width: 48px;
                height: 48px;
            }

            .desenho-arrudas {
                width: 900px;
                top: 45%;
                left: 40%;
            }
        }

        /* TELAS BAIXAS */

        @media (min-width: 601px) and (max-height: 650px) {
            .escute {
                top: 27vh;
            }

            .audio {
                top: 27vh;
                max-height: calc(73vh - 58px);
            }
        }
    </style>
</head>

<body class="carregando">

    <!-- MAPA -->

    <div class="mapa">
        <iframe
            allowfullscreen
            allow="geolocation"
            src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false">
        </iframe>

        <img
            class="desenho-arrudas"
            src="desenho_mapa.svg"
            alt="">
    </div>

    <!-- TÍTULO / MENU -->

    <div class="titulo" id="titulo">
        <h1>Arrudas</h1>
        <p>Memórias Sonoras de um Território-Rio</p>

        <div class="menu-links">
            <a href="sobre.html">Sobre o projeto</a>
            <a href="creditos.html">Ficha técnica</a>
        </div>
    </div>

    <!-- ESCUTE -->

    <div class="escute" id="escute">
    <img src="orelha.png" alt="Orelha — escute">
    <span>ESCUTE</span>

    </div>

    <!-- WAVEFORM E ÁUDIO -->

    <div class="audio" id="audioPlayer">

        <button
            class="fechar-audio"
            id="fecharAudio"
            type="button"
            aria-label="Fechar áudio">
            ×
        </button>

        <div class="player">
            <div class="waveform-bloco">

                <div
                    class="waveform-visualizacao"
                    id="waveformVisualizacao">

                    <div id="waveform"></div>

                    <button
                        class="botao-play"
                        id="botaoPlay"
                        aria-label="Reproduzir"
                        type="button">
                        ▶
                    </button>

                </div>

                <div class="controles-waveform">
                    <div class="tempo" id="tempo">
                        00:00 / 00:00
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- INTERAÇÕES E WAVESURFER -->

    <script type="module">
        import WaveSurfer from
            'https://cdn.jsdelivr.net/npm/wavesurfer.js@8/dist/wavesurfer.esm.js';

        /* ELEMENTOS DO SITE */

        const titulo = document.getElementById("titulo");
        const escute = document.getElementById("escute");

        /* MOSTRA O TÍTULO E O ESCUTE APÓS O CARREGAMENTO DO MAPA */

        const mapaIframe = document.querySelector(".mapa iframe");

        function mostrarElementos() {
            setTimeout(function () {
                document.body.classList.remove("carregando");

                titulo.style.visibility = "visible";
                escute.style.visibility = "visible";

                titulo.style.opacity = "0";
                escute.style.opacity = "0";

                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        titulo.style.opacity = "1";
                        escute.style.opacity = "1";
                    });
                });
            }, 500);
        }

        if (
            mapaIframe.contentDocument &&
            mapaIframe.contentDocument.readyState === "complete"
        ) {
            mostrarElementos();
        } else {
            mapaIframe.addEventListener("load", mostrarElementos, {
                once: true
            });
        }

        const audioPlayer = document.getElementById("audioPlayer");
        const fecharAudio = document.getElementById("fecharAudio");

        const botaoPlay = document.getElementById("botaoPlay");
        const tempo = document.getElementById("tempo");

        const waveformVisualizacao =
            document.getElementById("waveformVisualizacao");

        const waveformElemento = document.getElementById("waveform");

        const audioUrl =
            "https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.wav";

        let wavesurfer = null;
        let waveformIniciado = false;

        /* TÍTULO / MENU */

        titulo.addEventListener("click", function (event) {
            if (event.target.tagName !== "A") {
                titulo.classList.toggle("aberto");
            }
        });

        /* FORMATA O TEMPO */

        function formatarTempo(segundos) {
            const minutos = Math.floor(segundos / 60);
            const segundosRestantes = Math.floor(segundos % 60);

            return (
                String(minutos).padStart(2, "0") + ":" +
                String(segundosRestantes).padStart(2, "0")
            );
        }

        /* ATUALIZA O CONTADOR */

        function atualizarTempo() {
            if (!wavesurfer) {
                return;
            }

            const duracao = wavesurfer.getDuration();

            if (!duracao || !Number.isFinite(duracao)) {
                return;
            }

            const atual = wavesurfer.getCurrentTime();

            tempo.textContent =
                formatarTempo(atual) + " / " +
                formatarTempo(duracao);
        }

        /* INICIALIZAÇÃO DO WAVESURFER */

        function iniciarWaveform() {
            if (waveformIniciado) {
                return;
            }

            waveformIniciado = true;

            try {
                wavesurfer = WaveSurfer.create({
                    container: "#waveform",
                    url: audioUrl,
                    height: 280,
                    waveColor: "#B79A78",
                    progressColor: "#6F7770",
                    cursorWidth: 0,
                    normalize: false,
                    interact: false,
                    barWidth: 2,
                    barGap: 1,
                    barRadius: 3
                });

                /* ÁUDIO CARREGADO: APARIÇÃO GRADUAL */

                wavesurfer.on("ready", function () {
                    audioPlayer.classList.add("pronto");
                    atualizarTempo();

                    requestAnimationFrame(function () {
                        requestAnimationFrame(function () {
                            waveformElemento.classList.add("carregado");
                        });
                    });
                });

                /* ATUALIZA O TEMPO DURANTE A REPRODUÇÃO */

                wavesurfer.on("timeupdate", function () {
                    atualizarTempo();
                });

                /* BOTÃO PLAY / PAUSA */

                wavesurfer.on("play", function () {
                    botaoPlay.textContent = "Ⅱ";
                    botaoPlay.setAttribute("aria-label", "Pausar");
                });

                wavesurfer.on("pause", function () {
                    botaoPlay.textContent = "▶";
                    botaoPlay.setAttribute("aria-label", "Reproduzir");
                });

                /* FIM DA PEÇA */

                wavesurfer.on("finish", function () {
                    botaoPlay.textContent = "▶";
                    botaoPlay.setAttribute("aria-label", "Reproduzir");
                    atualizarTempo();
                });

                /* ERROS */

                wavesurfer.on("error", function (erro) {
                    console.error("Erro no WaveSurfer:", erro);
                });

            } catch (erro) {
                console.error("Erro ao iniciar o WaveSurfer:", erro);
            }
        }

        /* ESCUTE: ABRIR O ÁUDIO */

        escute.addEventListener("click", function () {
            escute.classList.add("oculto");
            audioPlayer.classList.add("aberto");

            requestAnimationFrame(function () {
                iniciarWaveform();
            });
        });

        /* X: FECHAR O ÁUDIO */

        fecharAudio.addEventListener("click", function () {
            if (wavesurfer) {
                wavesurfer.pause();
            }

            audioPlayer.classList.remove("aberto");
            escute.classList.remove("oculto");
        });

        /* PLAY / PAUSA */

        botaoPlay.addEventListener("click", async function (event) {
            event.stopPropagation();

            if (!waveformIniciado) {
                iniciarWaveform();
                return;
            }

            if (wavesurfer) {
                try {
                    await wavesurfer.playPause();
                } catch (erro) {
                    console.error("Erro na reprodução:", erro);
                }
            }
        });

        /* CLICAR NA ONDA PARA ESCOLHER O INSTANTE */

        waveformVisualizacao.addEventListener(
            "click",
            function (event) {
                if (
                    event.target === botaoPlay ||
                    !wavesurfer ||
                    !wavesurfer.getDuration()
                ) {
                    return;
                }

                const area =
                    waveformVisualizacao.getBoundingClientRect();

                const posicao = event.clientX - area.left;

                const proporcao = Math.max(
                    0,
                    Math.min(1, posicao / area.width)
                );

                wavesurfer.seekTo(proporcao);
                atualizarTempo();
            }
        );
    </script>

</body>
</html>
