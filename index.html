<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto Arrudas</title>

    <style>

        /* Configurações gerais da página */

        body {
            margin: 0;
            padding: 0;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: #f3f0e8;
            min-height: 100vh;
        }


        /* Menu */

        .menu {
            position: absolute;
            top: 25px;
            right: 30px;
            z-index: 10;
        }

        .menu-button {
            background: none;
            border: none;
            font-family: "Courier New", monospace;
            font-size: 28px;
            cursor: pointer;
            color: #222;
        }


        /* Opções do menu */

        .menu-content {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background-color: #f3f0e8;
            padding: 15px 20px;
            border: 1px solid #222;
            min-width: 180px;
        }

        .menu-content a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 15px;
            padding: 8px 0;
        }

        .menu-content a:hover {
            text-decoration: underline;
        }


        /* O menu aparece quando clicamos */

        .menu:hover .menu-content {
            display: block;
        }


        /* Conteúdo principal */

        main {
            max-width: none;
            margin: 0 auto;
            padding: 100px 30px 60px;
        }


        /* Título */

        h1 {
            text-align: center;
            font-size: 42px;
            font-weight: normal;
            margin-bottom: 10px;
        }


        /* Subtítulo */

        .subtitulo {
            text-align: center;
            font-size: 20px;
            margin-bottom: 60px;
        }


        /* Mapa */

        .mapa {
            width: 90%;
            max-width: 1400px;
            height: 600px;
            margin: 40px auto;
 
        }

        .mapa iframe {
            width: 100%;
            height: 600px;
            border: none;

        }


        /* Player de áudio */

        .audio {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .audio audio {
            width: 70%;
            max-width: 800px;
        }


        /* Ajustes para telas pequenas */

        @media (max-width: 600px) {

            .menu {
                top: 20px;
                right: 20px;
            }

            main {
                padding: 80px 20px 50px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitulo {
                font-size: 18px;
                margin-bottom: 40px;
            }

            .mapa {
                height: 500px;
            }

            .audio audio {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- MENU -->

    <div class="menu">

        <button class="menu-button">☰</button>

        <div class="menu-content">

            <a href="sobre.html">Sobre o projeto</a>

            <a href="creditos.html">Ficha técnica</a>

        </div>

    </div>


    <!-- CONTEÚDO PRINCIPAL -->

    <main>

        <h1>PROJETO ARRUDAS</h1>

        <p class="subtitulo">
            Uma investigação sonora sobre o Ribeirão Arrudas
        </p>

<!-- MAPA -->

<div class="mapa">

    <iframe
        style="width: 100%; height: 300px; border: 0;"
        allowfullscreen
        allow="geolocation"
        src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=true&editMode=disabled&moreControl=true&searchControl=null&tilelayersControl=null&embedControl=null&datalayersControl=true&onLoadPanel=none&captionBar=false&captionMenus=true">
    </iframe>

    <p>
        <a href="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=true&searchControl=null&tilelayersControl=null&embedControl=null&datalayersControl=true&onLoadPanel=none&captionBar=false&captionMenus=true">
            Ver em ecrã total
        </a>
    </p>

</div>
        

<!-- PLAYER DE ÁUDIO -->

        <div class="audio">

            <audio controls loop>
                <source src="Arrudas_Peça Sonora_.mp3" type="audio/mpeg">
            </audio>

        </div>


    </main>


</body>

</html>
