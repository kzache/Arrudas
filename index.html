
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrudas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            color: #222;
        }

        /* MAPA */

        .mapa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }

        /* DESENHO DO ARRUDAS */

        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 122%;
            height: 122%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 1.8s ease-out 1.5s forwards;
            transform: translate(-170px, -1px);
        }

        @keyframes entradaDesenho {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* TÍTULO / MENU — POSIÇÃO ORIGINAL */

        .titulo {
            position: fixed;
            top: 40px;
            left: 30px;
            z-index: 20;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 25px 40px;
            text-align: center;
            min-width: 420px;
            cursor: pointer;
        }

        .titulo h1 {
            margin: 0;
            font-size: 38px;
            font-weight: normal;
        }

        .titulo p {
            margin: 10px 0 0;
            font-size: 18px;
        }

        /* MENU LATERAL */

        .menu-links {
            position: absolute;
            top: 0;
            left: 100%;
            display: none;
            width: 190px;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 15px 20px;
            text-align: left;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 15px;
            padding: 7px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* ESCUTE */

        .escute {
            position: fixed;
            left: 50%;
            top: 36vh;
            transform: translateX(-50%);
            z-index: 30;
            width: 60vw;
            max-width: 900px;
            padding: 16px 20px;
            background-color: rgba(243, 240, 232, 0.72);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            font-family: "Courier New", monospace;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }

        .escute:hover {
            background-color: rgba(235, 229, 217, 0.78);
        }

        /* ESCUTE DESAPARECE QUANDO O ÁUDIO ABRE */

        .escute.oculto {
            display: none;
        }

        /* PAINEL DE ÁUDIO */

        .audio {
            display: none;
            position: fixed;
            left: 50%;
            top: 36vh;
            transform: translateX(-50%);
            z-index: 30;
            width: 75vw;
            max-width: 1100px;
            max-height: calc(64vh - 58px);
            overflow-y: auto;
            background-color: rgba(243, 240, 232, 0.58);
            border: none;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            padding: 22px 24px;
        }

        .audio.aberto {
            display: block;
        }

        /* BOTÃO PARA FECHAR O PAINEL */

        .fechar-audio {
            position: absolute;
            top: 4px;
            right: 10px;
            z-index: 5;
            border: none;
            background: transparent;
            padding: 0;
            color: #222;
            font-family: "Courier New", monospace;
            font-size: 25px;
            line-height: 1;
            cursor: pointer;
        }

        .fechar-audio:hover {
            color: #85593c;
        }

        .player {
            width: 100%;
        }

        /* FORMA DE ONDA — SEM CAIXA INTERNA */

        .waveform-bloco {
            width: 100%;
        }

        .waveform-visualizacao {
            position: relative;
            width: 100%;
            min-height: 180px;
            cursor: pointer;
            background: transparent;
            border: none;
            overflow: hidden;
        }

        #waveform {
            width: 100%;
            min-height: 180px;
        }

        /* MÁSCARA DE REVELAÇÃO */

        #mascaraWaveform {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            background: rgba(243, 240, 232, 0.58);
            pointer-events: none;
            z-index: 4;
            transition: none;
        }

        /* CONTROLES */

        .controles-waveform {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
        }

        .botao-play {
            width: 36px;
            height: 36px;
            padding: 0;
            background-color: rgba(243, 240, 232, 0.85);
            border: 1px solid #222;
            font-family: "Courier New", monospace;
            font-size: 15px;
            color: #222;
            cursor: pointer;
            flex-shrink: 0;
        }

        .botao-play:hover {
            background-color: #ebe5d9;
        }

        .tempo {
            font-size: 13px;
            text-align: right;
            flex-shrink: 0;
        }

        #statusWaveform {
            margin: 12px 0 0;
            font-size: 11px;
            line-height: 1.4;
            font-weight: normal;
        }

        /* CELULAR */

        @media (max-width: 600px) {
            .titulo {
                top: 25px;
                left: 15px;
                width: calc(100% - 100px);
                min-width: 0;
                padding: 18px 15px;
            }

            .titulo h1 {
                font-size: 27px;
            }

            .titulo p {
                font-size: 16px;
            }

            .menu-links {
                top: 100%;
                left: 0;
                width: 100%;
            }

            .escute {
                left: 15px;
                top: 165px;
                transform: none;
                width: calc(100% - 30px);
                max-width: none;
                font-size: 18px;
            }

            .audio {
                left: 15px;
                top: 165px;
                transform: none;
                width: calc(100% - 30px);
                max-width: none;
                max-height: calc(100vh - 230px);
                padding: 30px 16px 16px;
            }

            .waveform-visualizacao,
            #waveform {
                min-height: 140px;
            }

            .desenho-arrudas {
                width: 900px;
                top: 45%;
                left: 40%;
            }
        }

        /* TELAS BAIXAS */

        @media (min-width: 601px) and (max-height: 650px) {
            .escute {
                top: 27vh;
            }

            .audio {
                top: 27vh;
                max-height: calc(73vh - 58px);
            }
        }
    </style>
</head>

<body>

    <!-- MAPA -->

    <div class="mapa">
        <iframe
            allowfullscreen
            allow="geolocation"
            src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false">
        </iframe>

        <img
            class="desenho-arrudas"
            src="desenho_mapa.svg"
            alt="">
    </div>

    <!-- TÍTULO / MENU -->

    <div class="titulo" id="titulo">
        <h1>Arrudas</h1>
        <p>Memórias Sonoras de um Território-Rio</p>

        <div class="menu-links">
            <a href="sobre.html">Sobre o projeto</a>
            <a href="creditos.html">Ficha técnica</a>
        </div>
    </div>

    <!-- ESCUTE -->

    <div class="escute" id="escute">
        ESCUTE
    </div>

    <!-- WAVEFORM E ÁUDIO -->

    <div class="audio" id="audioPlayer">

        <button
            class="fechar-audio"
            id="fecharAudio"
            type="button"
            aria-label="Fechar áudio">
            ×
        </button>

        <div class="player">
            <div class="waveform-bloco">

                <div
                    class="waveform-visualizacao"
                    id="waveformVisualizacao">

                    <div id="waveform"></div>

                    <div id="mascaraWaveform"></div>

                </div>

                <div class="controles-waveform">

                    <button
                        class="botao-play"
                        id="botaoPlay"
                        aria-label="Reproduzir"
                        type="button">
                        ▶
                    </button>

                    <div class="tempo" id="tempo">
                        00:00 / 00:00
                    </div>

                </div>

                <p id="statusWaveform">
                    Abra o player para carregar a peça sonora.
                </p>

            </div>
        </div>
    </div>

    <!-- INTERAÇÕES E WAVESURFER -->

    <script type="module">
        import WaveSurfer from
            'https://cdn.jsdelivr.net/npm/wavesurfer.js@8/dist/wavesurfer.esm.js';

        /* ELEMENTOS DO SITE */

        const titulo = document.getElementById("titulo");
        const escute = document.getElementById("escute");
        const audioPlayer = document.getElementById("audioPlayer");
        const fecharAudio = document.getElementById("fecharAudio");

        const botaoPlay = document.getElementById("botaoPlay");
        const tempo = document.getElementById("tempo");

        const waveformVisualizacao =
            document.getElementById("waveformVisualizacao");

        const mascaraWaveform =
            document.getElementById("mascaraWaveform");

        const statusWaveform =
            document.getElementById("statusWaveform");

        const audioUrl =
            "https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.wav";

        let wavesurfer = null;
        let waveformIniciado = false;

        /* TÍTULO / MENU */

        titulo.addEventListener("click", function (event) {
            if (event.target.tagName !== "A") {
                titulo.classList.toggle("aberto");
            }
        });

        /* FORMATA O TEMPO */

        function formatarTempo(segundos) {
            const minutos = Math.floor(segundos / 60);
            const segundosRestantes = Math.floor(segundos % 60);

            return (
                String(minutos).padStart(2, "0") + ":" +
                String(segundosRestantes).padStart(2, "0")
            );
        }

        /* ATUALIZA A REVELAÇÃO E O CONTADOR */

        function atualizarWaveform() {
            if (!wavesurfer) {
                return;
            }

            const duracao = wavesurfer.getDuration();

            if (!duracao || !Number.isFinite(duracao)) {
                return;
            }

            const atual = wavesurfer.getCurrentTime();

            const proporcao = Math.max(
                0,
                Math.min(1, atual / duracao)
            );

            mascaraWaveform.style.width =
                ((1 - proporcao) * 100) + "%";

            tempo.textContent =
                formatarTempo(atual) + " / " +
                formatarTempo(duracao);
        }

        /* INICIALIZAÇÃO DO WAVESURFER */

        function iniciarWaveform() {
            if (waveformIniciado) {
                return;
            }

            waveformIniciado = true;

           

            try {
                wavesurfer = WaveSurfer.create({
                container: "#waveform",
                url: audioUrl,
                height: 180,
                waveColor: "#85593c",
                progressColor: "#85593c",
                cursorWidth: 0,
                normalize: false,
                interact: false
                });

                /* ÁUDIO CARREGADO */

                wavesurfer.on("ready", function () {
                   
                    mascaraWaveform.style.transition = "none";
                    mascaraWaveform.style.width = "100%";

                    atualizarWaveform();
                });

                /* REVELAÇÃO DURANTE A REPRODUÇÃO */

                wavesurfer.on("timeupdate", function () {
                    atualizarWaveform();
                });

                /* BOTÃO PLAY / PAUSA */

                wavesurfer.on("play", function () {
                    botaoPlay.textContent = "Ⅱ";
                    botaoPlay.setAttribute("aria-label", "Pausar");
                    statusWaveform.textContent = "Reproduzindo...";
                });

                wavesurfer.on("pause", function () {
                    botaoPlay.textContent = "▶";
                    botaoPlay.setAttribute("aria-label", "Reproduzir");
                    statusWaveform.textContent = "Áudio pausado.";
                });

                /* FIM DA PEÇA */

                wavesurfer.on("finish", function () {
                    botaoPlay.textContent = "▶";
                    botaoPlay.setAttribute("aria-label", "Reproduzir");
                    statusWaveform.textContent = "Reprodução concluída.";

                    atualizarWaveform();
                });

                /* ERROS */

                wavesurfer.on("error", function (erro) {
                    statusWaveform.textContent =
                        "Não foi possível carregar o áudio. " +
                        "Verifique a conexão e o acesso ao arquivo.";

                    console.error("Erro no WaveSurfer:", erro);
                });

            } catch (erro) {
                statusWaveform.textContent =
                    "Erro ao iniciar o áudio. Consulte o console.";

                console.error("Erro ao iniciar o WaveSurfer:", erro);
            }
        }

        /* ESCUTE: ABRIR O ÁUDIO E OCULTAR A CAIXA */

        escute.addEventListener("click", function () {
            escute.classList.add("oculto");
            audioPlayer.classList.add("aberto");

            requestAnimationFrame(function () {
                iniciarWaveform();
            });
        });

        /* X: FECHAR O ÁUDIO E MOSTRAR ESCUTE NOVAMENTE */

        fecharAudio.addEventListener("click", function () {
            if (wavesurfer) {
                wavesurfer.pause();
            }

            audioPlayer.classList.remove("aberto");
            escute.classList.remove("oculto");
        });

        /* PLAY / PAUSA */

        botaoPlay.addEventListener("click", async function () {
            if (!waveformIniciado) {
                iniciarWaveform();

                statusWaveform.textContent =
                    "Carregando áudio...";

                return;
            }

            if (wavesurfer) {
                try {
                    await wavesurfer.playPause();
                } catch (erro) {
                    console.error("Erro na reprodução:", erro);

                    statusWaveform.textContent =
                        "Não foi possível reproduzir o áudio. Tente novamente.";
                }
            }
        });

        /* CLICAR NA ONDA PARA ESCOLHER O INSTANTE */

        waveformVisualizacao.addEventListener(
            "click",
            function (event) {
                if (!wavesurfer || !wavesurfer.getDuration()) {
                    return;
                }

                const area =
                    waveformVisualizacao.getBoundingClientRect();

                const posicao = event.clientX - area.left;

                const proporcao = Math.max(
                    0,
                    Math.min(1, posicao / area.width)
                );

                wavesurfer.seekTo(proporcao);
                atualizarWaveform();
            }
        );
    </script>

</body>
</html>
