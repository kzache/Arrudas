
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJETO ARRUDAS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            background: #f3f0e8;
            color: #222;
        }

        /* MAPA */
        #mapa {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            filter: sepia(0.65);
            z-index: 1;
        }

        /* DESENHO SOBRE O MAPA */
        #desenhoMapa {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: translate(-170px, -1px);
            pointer-events: none;
            z-index: 2;
        }

        /* TÍTULO E MENU */
        .titulo {
            position: fixed;
            top: 40px;
            left: 30px;
            z-index: 10;
            padding: 25px 40px;
            min-width: 420px;
            background: rgba(243, 240, 232, 0.78);
            border: 1px solid rgba(133, 89, 60, 0.65);
            backdrop-filter: blur(3px);
        }

        .titulo h1 {
            margin: 0;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .subtitulo {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .menu {
            position: absolute;
            top: 18px;
            right: 18px;
        }

        .menu-botao {
            padding: 0;
            border: 0;
            background: transparent;
            color: #222;
            font-family: inherit;
            font-size: 27px;
            cursor: pointer;
        }

        .menu-conteudo {
            display: none;
            position: absolute;
            top: 35px;
            right: 0;
            min-width: 190px;
            padding: 12px 15px;
            background: #f3f0e8;
            border: 1px solid #85593c;
        }

        .menu-conteudo.aberto {
            display: block;
        }

        .menu-conteudo a {
            display: block;
            padding: 8px 0;
            color: #222;
            text-decoration: none;
            font-size: 13px;
        }

        .menu-conteudo a:hover {
            color: #85593c;
        }

        /* ÁREA DAS CAIXAS: AMBAS OCUPAM O MESMO LUGAR */
        .areaEscuta {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            z-index: 20;
        }

        /* CAIXA ESCUTE */
        .escute {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100px;
            padding: 22px;
            border: 1px solid rgba(133, 89, 60, 0.75);
            background: rgba(243, 240, 232, 0.58);
            backdrop-filter: blur(3px);
            cursor: pointer;
            font-family: inherit;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #222;
            transition: background 0.2s ease;
        }

        .escute:hover {
            background: rgba(243, 240, 232, 0.78);
        }

        /* PAINEL DO ÁUDIO */
        .audio {
            display: none;
            position: relative;
            width: 100%;
            padding: 34px 28px 22px;
            border: 1px solid rgba(133, 89, 60, 0.75);
            background: rgba(243, 240, 232, 0.58);
            backdrop-filter: blur(3px);
        }

        .audio.aberto {
            display: block;
        }

        /* BOTÃO FECHAR */
        .fechar-audio {
            position: absolute;
            top: 5px;
            right: 12px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #222;
            font-family: inherit;
            font-size: 27px;
            line-height: 1;
            cursor: pointer;
        }

        .fechar-audio:hover {
            color: #85593c;
        }

        /* FORMA DE ONDA */
        .waveform-visualizacao {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
            background: transparent;
            border: 0;
        }

        #waveform {
            width: 100%;
            height: 180px;
            background: transparent;
            clip-path: inset(0 100% 0 0);
        }

        #waveform wave {
            overflow: hidden !important;
        }

        /* CONTROLES */
        .controles-audio {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 12px;
        }

        .botao-reproducao {
            padding: 8px 14px;
            border: 1px solid #85593c;
            background: transparent;
            color: #222;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .botao-reproducao:hover {
            background: rgba(133, 89, 60, 0.12);
        }

        .tempo-audio {
            font-size: 12px;
            color: #222;
        }

        @media (max-width: 700px) {
            .titulo {
                top: 25px;
                left: 15px;
                right: 15px;
                min-width: 0;
                padding: 20px 22px;
            }

            .titulo h1 {
                font-size: 23px;
            }

            .subtitulo {
                max-width: 260px;
                font-size: 12px;
            }

            .areaEscuta {
                top: 60%;
                width: calc(100% - 30px);
            }

            .escute {
                min-height: 85px;
                font-size: 24px;
            }

            .audio {
                padding: 34px 16px 16px;
            }

            .waveform-visualizacao,
            #waveform {
                height: 140px;
            }

            #desenhoMapa {
                transform: translate(-170px, -1px);
            }
        }
    </style>
</head>

<body>

    <!-- MAPA -->
    <iframe
        id="mapa"
        src="https://umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMap=false&scrollWheelZoom=false&zoomControl=false&allowEdit=false&moreControl=false&searchControl=null&tilelayersControl=null&embedControl=null&datalayersControl=false&onLoadPanel=none&captionBar=false"
        allowfullscreen
        loading="lazy">
    </iframe>

    <!-- DESENHO DO MAPA -->
    <img
        id="desenhoMapa"
        src="desenho_mapa.svg"
        alt=""
    >

    <!-- TÍTULO E MENU -->
    <header class="titulo">
        <h1>PROJETO ARRUDAS</h1>
        <div class="subtitulo">
            Uma investigação sonora sobre o Ribeirão Arrudas
        </div>

        <div class="menu">
            <button
                class="menu-botao"
                id="menuBotao"
                aria-label="Abrir menu"
                aria-expanded="false">
                ☰
            </button>

            <nav class="menu-conteudo" id="menuConteudo">
                <a href="sobre.html">Sobre o projeto</a>
                <a href="creditos.html">Ficha técnica</a>
            </nav>
        </div>
    </header>

    <!-- AS DUAS CAIXAS OCUPAM EXATAMENTE A MESMA ÁREA -->
    <main class="areaEscuta">

        <!-- CAIXA INICIAL -->
        <button
            class="escute"
            id="botaoEscute"
            type="button">
            ESCUTE
        </button>

        <!-- CAIXA DO ÁUDIO -->
        <section
            class="audio"
            id="painelAudio"
            aria-label="Reprodutor de áudio">

            <button
                class="fechar-audio"
                id="fecharAudio"
                type="button"
                aria-label="Fechar áudio">
                ×
            </button>

            <div class="waveform-visualizacao">
                <div id="waveform"></div>
            </div>

            <div class="controles-audio">
                <button
                    class="botao-reproducao"
                    id="botaoReproducao"
                    type="button">
                    ▶ Reproduzir
                </button>

                <span class="tempo-audio" id="tempoAudio">
                    0:00 / 0:00
                </span>
            </div>
        </section>

    </main>

    <script type="module">
        import WaveSurfer from
            'https://cdn.jsdelivr.net/npm/wavesurfer.js@8/dist/wavesurfer.esm.js';

        const audioUrl =
            'https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.wav';

        const botaoEscute = document.getElementById('botaoEscute');
        const painelAudio = document.getElementById('painelAudio');
        const fecharAudio = document.getElementById('fecharAudio');
        const botaoReproducao = document.getElementById('botaoReproducao');
        const tempoAudio = document.getElementById('tempoAudio');
        const waveform = document.getElementById('waveform');

        const menuBotao = document.getElementById('menuBotao');
        const menuConteudo = document.getElementById('menuConteudo');

        let audioPronto = false;

        const wavesurfer = WaveSurfer.create({
            container: '#waveform',
            url: audioUrl,
            height: 180,
            waveColor: '#85593c',
            progressColor: '#85593c',
            cursorWidth: 0,
            normalize: false,
            interact: false,
            barWidth: 2,
            barGap: 2,
            barRadius: 0
        });

        function formatarTempo(segundos) {
            if (!Number.isFinite(segundos)) return '0:00';

            const minutos = Math.floor(segundos / 60);
            const segundosRestantes = Math.floor(segundos % 60);

            return minutos + ':' +
                String(segundosRestantes).padStart(2, '0');
        }

        function atualizarWaveform() {
            const duracao = wavesurfer.getDuration();
            const atual = wavesurfer.getCurrentTime();

            if (!duracao || !Number.isFinite(duracao)) {
                tempoAudio.textContent = '0:00 / 0:00';
                return;
            }

            const proporcao = Math.min(1, Math.max(0, atual / duracao));
            const restante = (1 - proporcao) * 100;

            waveform.style.clipPath =
                'inset(0 ' + restante + '% 0 0)';

            tempoAudio.textContent =
                formatarTempo(atual) + ' / ' + formatarTempo(duracao);
        }

        function abrirAudio() {
            botaoEscute.style.display = 'none';
            painelAudio.classList.add('aberto');

            atualizarWaveform();
        }

        function fecharPainelAudio() {
            wavesurfer.pause();
            painelAudio.classList.remove('aberto');
            botaoEscute.style.display = 'flex';
            botaoReproducao.textContent = '▶ Reproduzir';
        }

        botaoEscute.addEventListener('click', abrirAudio);

        fecharAudio.addEventListener('click', fecharPainelAudio);

        botaoReproducao.addEventListener('click', () => {
            if (!audioPronto) return;

            wavesurfer.playPause();
        });

        wavesurfer.on('ready', () => {
            audioPronto = true;
            waveform.style.clipPath = 'inset(0 100% 0 0)';
            atualizarWaveform();
        });

        wavesurfer.on('play', () => {
            botaoReproducao.textContent = 'Ⅱ Pausar';
        });

        wavesurfer.on('pause', () => {
            botaoReproducao.textContent = '▶ Reproduzir';
        });

        wavesurfer.on('timeupdate', atualizarWaveform);

        wavesurfer.on('finish', () => {
            botaoReproducao.textContent = '▶ Reproduzir';
            atualizarWaveform();
        });

        wavesurfer.on('error', (erro) => {
            console.error('Erro ao carregar o áudio:', erro);
        });

        /* O menu abre e fecha ao clicar no ícone */
        menuBotao.addEventListener('click', () => {
            const aberto = menuConteudo.classList.toggle('aberto');
            menuBotao.setAttribute('aria-expanded', String(aberto));
        });

        /* Clicar fora do menu fecha o menu */
        document.addEventListener('click', (evento) => {
            if (
                !menuConteudo.contains(evento.target) &&
                !menuBotao.contains(evento.target)
            ) {
                menuConteudo.classList.remove('aberto');
                menuBotao.setAttribute('aria-expanded', 'false');
            }
        });
    </script>

</body>
</html>
