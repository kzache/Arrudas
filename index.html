```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arrudas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            color: #222;
        }

        /* MAPA */

        .mapa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        /* DESENHO DO ARRUDAS */

        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 125%;
            height: 125%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 1.8s ease-out 1.5s forwards;
            transform: translate(-35px, -26px);
        }

        @keyframes entradaDesenho {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* CAIXA DO TÍTULO */

        .titulo {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background-color: rgba(243, 240, 232, 0.94);
            border: none;
            padding: 25px 40px;
            text-align: center;
            min-width: 420px;
        }

        .titulo h1 {
            margin: 0 0 10px;
            font-size: 38px;
            font-weight: normal;
        }

        .titulo p {
            margin: 0;
            font-size: 18px;
        }

        /* MENU */

        .menu {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 20;
        }

        .menu-button {
            width: 48px;
            height: 48px;
            background-color: #f3f0e8;
            border: 1px solid #222;
            font-family: "Courier New", monospace;
            font-size: 28px;
            cursor: pointer;
            color: #222;
        }

        .menu-content {
            display: none;
            position: absolute;
            right: 0;
            top: 55px;
            background-color: #f3f0e8;
            padding: 15px 20px;
            border: 1px solid #222;
            min-width: 180px;
        }

        .menu-content a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 15px;
            padding: 8px 0;
        }

        .menu-content a:hover {
            text-decoration: underline;
        }

        .menu:hover .menu-content {
            display: block;
        }

        /* PLAYER DE ÁUDIO */

        .audio {
            position: fixed;
            left: 50%;
            bottom: 35px;
            transform: translateX(-50%);
            z-index: 10;
            width: 70%;
            max-width: 800px;
        }

        .audio audio {
            width: 100%;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .titulo {
                top: 25px;
                width: calc(100% - 100px);
                min-width: 0;
                padding: 18px 15px;
            }

            .titulo h1 {
                font-size: 27px;
            }

            .titulo p {
                font-size: 16px;
            }

            .menu {
                top: 15px;
                right: 15px;
            }

            .menu-button {
                width: 42px;
                height: 42px;
                font-size: 24px;
            }

            .audio {
                width: calc(100% - 40px);
                bottom: 25px;
            }

            .desenho-arrudas {
                width: 900px;
                top: 45%;
                left: 40%;
            }
        }

        /* COR DO MAPA */

        .mapa iframe {
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }

    </style>

</head>

<body>

    <!-- MAPA -->

    <div class="mapa">

        <iframe
            allowfullscreen
            allow="geolocation"
            src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false">
        </iframe>

        <img
            class="desenho-arrudas"
            src="desenho_mapa.svg"
            alt=""
        >

    </div>

    <!-- TÍTULO -->

    <div class="titulo">

        <h1>Arrudas</h1>

        <p>Memórias Sonoras de um Território-Rio</p>

    </div>

    <!-- MENU -->

    <div class="menu">

        <button class="menu-button">☰</button>

        <div class="menu-content">

            <a href="sobre.html">Sobre o projeto</a>

            <a href="creditos.html">Ficha técnica</a>

        </div>

    </div>

    <!-- ÁUDIO -->

    <div class="audio">

        <audio controls loop>

            <source
                src="Arrudas_Peça Sonora_.mp3"
                type="audio/mpeg">

        </audio>

    </div>

</body>

</html>
