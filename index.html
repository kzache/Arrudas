
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Arrudas - Memórias Sonoras de um Território-Rio</title>

    <style>
        :root {
            --cor-arrudas: #1c4354;
            --cor-fundo: #d8d0bc;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: var(--cor-fundo);
            overflow: hidden;
            user-select: none;
            overscroll-behavior: none;
        }

        /* ==========================================
           1. MODO COMPUTADOR (Desktop > 850px) — INALTERADO
           ========================================== */
        @media (min-width: 851px) {
            .tela-referencia {
                position: absolute;
                left: 0;
                top: 0;
                width: 1920px;
                height: 1080px;
                transform-origin: 0 0;
                z-index: 1;
                background-color: var(--cor-fundo);
                will-change: transform;
            }
            .mobile { display: none; }
        }

        @media (max-width: 850px) {
            .tela-referencia { display: none; }
        }

        /* ELEMENTOS DO PC (e mapa/desenho, compartilhados com o mobile) */
        .mapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 1;
        }
        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }
        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 110%;
            height: 110%;
            z-index: 2;
            pointer-events: none;
            transform: translate(33px, 33px);
            background-image: linear-gradient(45deg, #651b28, var(--cor-arrudas));
            -webkit-mask-image: url("desenho_mapa.svg");
            mask-image: url("desenho_mapa.svg");
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }
        .titulo {
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 20;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 25px 40px;
            cursor: pointer;
            min-width: 420px;
        }
        .titulo h1 { margin: 0; font-size: 38px; font-weight: bold; }
        .titulo p { margin: 10px 0 0; font-size: 18px; }
        .menu-links {
            position: absolute;
            top: 0;
            left: 100%;
            display: none;
            width: 220px;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 15px 20px;
        }
        .titulo.aberto .menu-links { display: block; }
        .menu-links a { display: block; text-decoration: none; color: #222; font-size: 20px; padding: 7px 0; }

        .escute {
            position: absolute;
            left: 960px;
            top: 80px;
            transform: translateX(-50%);
            z-index: 30;
            width: 190px;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(28, 67, 84, 0.20);
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }
        .escute.oculto { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
        .escute img { width: 250px; height: 240px; object-fit: contain; position: relative; top: -62px; }
        .escute span { display: block; position: relative; z-index: 1; margin-top: -125px; color: var(--cor-arrudas); font-size: 35px; font-weight: bold; }

        .aviso-fone {
            position: absolute;
            left: 960px;
            top: 315px;
            transform: translateX(-50%);
            z-index: 31;
            width: 540px;
            padding: 22px 30px;
            background-color: rgba(28, 67, 84, 0.9);
            color: #e8e0cf;
            text-align: center;
            font-size: 24px;
            border-radius: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
        }
        .aviso-fone.visivel { opacity: 1 !important; visibility: visible !important; }
