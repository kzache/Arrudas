<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arrudas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            color: #222;
        }

        /* MAPA */

        .mapa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        /* DESENHO DO ARRUDAS */

        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 122%;
            height: 122%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 1.8s ease-out 1.5s forwards;
            transform: translate(-150px, 0px);
        }

        @keyframes entradaDesenho {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* CAIXA DO TÍTULO / MENU */

        .titulo {
            position: fixed;
            top: 40px;
            left: 30px;
            z-index: 20;

            display: flex;
            align-items: stretch;

            background-color: rgba(243, 240, 232, 0.94);

            padding: 0;

            cursor: pointer;
        }

        /* PARTE PRINCIPAL — ARRUDAS */

        .titulo-principal {
            padding: 25px 40px;
            text-align: center;
            min-width: 420px;
        }

        .titulo h1 {
            margin: 0 0 10px;
            font-size: 38px;
            font-weight: normal;
        }

        .titulo p {
            margin: 0;
            font-size: 18px;
        }

        /* EXTENSÃO DO MENU */

        .menu-links {
            display: none;

            padding: 25px 30px;

            border-left: 1px solid #222;

            min-width: 220px;

            align-items: center;
        }

        .titulo.aberto .menu-links {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 15px;
            padding: 8px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* ABA ESCUTE */

        .escute {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);

            z-index: 30;

            width: 42px;
            padding: 12px 8px;

            background-color: #f3f0e8;
            border: 1px solid #222;

            font-family: "Courier New", monospace;
            font-size: 18px;
            line-height: 1.1;
            text-align: center;

            cursor: pointer;
        }

        .escute span {
            display: block;
        }

        /* PLAYER DE ÁUDIO */

        .audio {
            position: fixed;
            left: 50%;
            bottom: 35px;
            transform: translateX(-50%);
            z-index: 10;
            width: 70%;
            max-width: 800px;
        }

        .audio audio {
            width: 100%;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .titulo {
                top: 25px;
                left: 15px;
            }

            .titulo-principal {
                padding: 18px 15px;
                min-width: 0;
                width: calc(100vw - 100px);
            }

            .titulo h1 {
                font-size: 27px;
            }

            .titulo p {
                font-size: 16px;
            }

            .menu-links {
                min-width: 180px;
                padding: 18px 20px;
            }

            .escute {
                left: 15px;
            }

            .audio {
                width: calc(100% - 40px);
                bottom: 25px;
            }

            .desenho-arrudas {
                width: 900px;
                top: 45%;
                left: 40%;
            }
        }

        /* COR DO MAPA */

        .mapa iframe {
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }

    </style>

</head>

<body>

    <!-- MAPA -->

    <div class="mapa">

        <iframe
            allowfullscreen
            allow="geolocation"
            src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false">
        </iframe>

        <img
            class="desenho-arrudas"
            src="desenho_mapa.svg"
            alt=""
        >

    </div>


    <!-- TÍTULO / MENU -->

    <div class="titulo" id="menuTitulo">

        <div class="titulo-principal">

            <h1>Arrudas</h1>

            <p>Memórias Sonoras de um Território-Rio</p>

        </div>

        <div class="menu-links">

            <a href="sobre.html">Sobre o projeto</a>

            <a href="creditos.html">Ficha técnica</a>

        </div>

    </div>


    <!-- ABA ESCUTE -->

    <div class="escute">

        <span>ES</span>
        <span>CU</span>
        <span>TE</span>

    </div>


    <!-- ÁUDIO -->

    <div class="audio">

        <audio controls loop>

            <source
                src="Arrudas_Peça Sonora_.mp3"
                type="audio/mpeg">

        </audio>

    </div>


    <!-- ABRIR / FECHAR MENU -->

    <script>

        const menuTitulo = document.getElementById("menuTitulo");

        menuTitulo.addEventListener("click", function () {
            menuTitulo.classList.toggle("aberto");
        });

    </script>

</body>

</html>
