```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arrudas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            color: #222;
        }

        /* MAPA */

        .mapa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        /* DESENHO DO ARRUDAS */

        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 122%;
            height: 122%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 1.8s ease-out 1.5s forwards;
            transform: translate(-160px, 0px);
        }

        @keyframes entradaDesenho {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* CAIXA DO TÍTULO / MENU */

        .titulo {
            position: fixed;
            top: 40px;
            left: 30px;
            z-index: 20;

            background-color: rgba(243, 240, 232, 0.94);

            padding: 25px 40px;
            text-align: center;
            min-width: 420px;

            cursor: pointer;
        }

        .titulo h1 {
            margin: 0;
            font-size: 38px;
            font-weight: normal;
        }

        .titulo p {
            margin: 10px 0 0;
            font-size: 18px;
        }

        /* MENU LATERAL */

        .menu-links {
            position: absolute;

            top: 0;
            left: 100%;

            display: none;

            width: 190px;

            background-color: rgba(243, 240, 232, 0.94);

            /* SEM BORDA */

            padding: 15px 20px;

            text-align: left;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;

            text-decoration: none;
            color: #222;

            font-size: 15px;

            padding: 7px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* ESCUTE */

        .escute {
            position: fixed;

            left: 30px;
            top: 190px;

            z-index: 30;

            width: 420px;

            padding: 16px 20px;

            background-color: #f3f0e8;

            /* SEM BORDA */

            font-family: "Courier New", monospace;
            font-size: 20px;
            font-weight: bold;

            text-align: center;

            cursor: pointer;
        }

        /* PLAYER */

        .audio {
            display: none;

            position: fixed;

            left: 30px;
            top: 245px;

            z-index: 30;

            width: 420px;

            background-color: #f3f0e8;
            border: 1px solid #222;

            padding: 15px 18px;
        }

        /* PLAYER APARECE AO CLICAR EM ESCUTE */

        .audio.aberto {
            display: block;
        }

        /* ESTRUTURA DO PLAYER */

        .player {
            width: 100%;
        }

        .player-controles {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* BOTÃO PLAY */

        .botao-play {
            width: 32px;
            height: 32px;

            padding: 0;

            background-color: #f3f0e8;
            border: 1px solid #222;

            font-family: "Courier New", monospace;
            font-size: 15px;

            color: #222;

            cursor: pointer;

            flex-shrink: 0;
        }

        /* ÁREA DA ONDA */

        .onda {
            position: relative;

            flex: 1;

            height: 45px;

            cursor: pointer;

            overflow: hidden;
        }

        /* LINHAS DA ONDA */

        .onda-linhas {
            position: absolute;

            top: 50%;
            left: 0;
            right: 0;

            height: 45px;

            transform: translateY(-50%);

            display: flex;

            align-items: center;
            justify-content: space-between;

            z-index: 1;
        }

        .onda-linhas span {
            display: block;

            width: 2px;

            background-color: #222;

            opacity: 0.35;

            transition: opacity 0.1s linear;
        }

        /* ONDA PERCORRIDA */

        .onda-progresso {
            position: absolute;

            top: 0;
            left: 0;

            width: 0%;
            height: 100%;

            background-color: rgba(133, 89, 60, 0.12);

            pointer-events: none;

            z-index: 2;
        }

        /* MARCA AS LINHAS JÁ PERCORRIDAS */

        .onda-linhas span.tocada {
            opacity: 1;
        }

        /* TEMPO */

        .tempo {
            min-width: 42px;

            font-size: 13px;

            text-align: right;

            flex-shrink: 0;
        }

        /* ESCONDE O ÁUDIO NATIVO */

        #audio {
            display: none;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .titulo {
                top: 25px;
                left: 15px;

                width: calc(100% - 100px);
                min-width: 0;

                padding: 18px 15px;
            }

            .titulo h1 {
                font-size: 27px;
            }

            .titulo p {
                font-size: 16px;
            }

            .menu-links {
                top: 100%;
                left: 0;

                width: 100%;
            }

            .escute {
                left: 15px;
                top: 165px;

                width: calc(100% - 30px);

                font-size: 18px;
            }

            .audio {
                left: 15px;
                top: 215px;

                width: calc(100% - 30px);
            }

            .desenho-arrudas {
                width: 900px;
                top: 45%;
                left: 40%;
            }

        }

        /* COR DO MAPA */

        .mapa iframe {
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }

    </style>

</head>

<body>

    <!-- MAPA -->

    <div class="mapa">

        <iframe
            allowfullscreen
            allow="geolocation"
            src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false">
        </iframe>

        <img
            class="desenho-arrudas"
            src="desenho_mapa.svg"
            alt=""
        >

    </div>


    <!-- TÍTULO / MENU -->

    <div class="titulo" id="titulo">

        <h1>Arrudas</h1>

        <p>Memórias Sonoras de um Território-Rio</p>

        <!-- MENU LATERAL -->

        <div class="menu-links">

            <a href="sobre.html">Sobre o projeto</a>

            <a href="creditos.html">Ficha técnica</a>

        </div>

    </div>


    <!-- ESCUTE -->

    <div class="escute" id="escute">

        ESCUTE

    </div>


    <!-- PLAYER -->

    <div class="audio" id="audioPlayer">

        <div class="player">

            <audio
                id="audio"
                preload="metadata"
                controlsList="nodownload noplaybackrate">

                <source
                    src="Arrudas_Peça Sonora_.mp3"
                    type="audio/mpeg">

            </audio>


            <div class="player-controles">

                <button
                    class="botao-play"
                    id="botaoPlay"
                    aria-label="Reproduzir">

                    ▶

                </button>


                <div
                    class="onda"
                    id="onda">

                    <div
                        class="onda-progresso"
                        id="ondaProgresso">
                    </div>

                    <div
                        class="onda-linhas"
                        id="ondaLinhas">
                    </div>

                </div>


                <div
                    class="tempo"
                    id="tempo">

                    00:00

                </div>

            </div>

        </div>

    </div>


    <!-- INTERAÇÕES -->

    <script>

        /* CAIXA DO TÍTULO / MENU */

        const titulo = document.getElementById("titulo");

        titulo.addEventListener("click", function (event) {

            if (event.target.tagName !== "A") {

                titulo.classList.toggle("aberto");

            }

        });


        /* ESCUTE / PLAYER */

        const escute = document.getElementById("escute");
        const audioPlayer = document.getElementById("audioPlayer");

        escute.addEventListener("click", function () {

            audioPlayer.classList.toggle("aberto");

        });


        /* PLAYER DE ONDA */

        const audio = document.getElementById("audio");
        const botaoPlay = document.getElementById("botaoPlay");
        const onda = document.getElementById("onda");
        const ondaLinhas = document.getElementById("ondaLinhas");
        const ondaProgresso = document.getElementById("ondaProgresso");
        const tempo = document.getElementById("tempo");


        /* CRIA A ONDA */

        const alturas = [
            12, 22, 30, 18, 36, 25, 14, 32, 20, 40,
            27, 16, 34, 23, 12, 29, 38, 20, 31, 17,
            25, 35, 15, 28, 39, 22, 13, 30, 19, 34,
            24, 16, 37, 27, 20, 32, 14, 25, 36, 18,
            29, 21, 13, 33, 24, 38, 19, 28, 16, 31
        ];


        alturas.forEach(function (altura) {

            const linha = document.createElement("span");

            linha.style.height = altura + "px";

            ondaLinhas.appendChild(linha);

        });


        /* PLAY / PAUSA */

        botaoPlay.addEventListener("click", function () {

            if (audio.paused) {

                audio.play();

                botaoPlay.textContent = "Ⅱ";

            } else {

                audio.pause();

                botaoPlay.textContent = "▶";

            }

        });


        /* ATUALIZA O TEMPO E A ONDA */

        audio.addEventListener("timeupdate", function () {

            if (!audio.duration) return;

            const progresso =
                audio.currentTime / audio.duration;

            /* ATUALIZA A MARCAÇÃO DE PROGRESSO */

            ondaProgresso.style.width =
                (progresso * 100) + "%";


            /* MARCA AS LINHAS JÁ TOCADAS */

            const linhas =
                ondaLinhas.querySelectorAll("span");

            linhas.forEach(function (linha, indice) {

                const posicao =
                    indice / linhas.length;

                if (posicao <= progresso) {

                    linha.classList.add("tocada");

                } else {

                    linha.classList.remove("tocada");

                }

            });


            /* ATUALIZA O TEMPO */

            const minutos =
                Math.floor(audio.currentTime / 60);

            const segundos =
                Math.floor(audio.currentTime % 60);

            tempo.textContent =
                String(minutos).padStart(2, "0") +
                ":" +
                String(segundos).padStart(2, "0");

        });


        /* CLICAR NA ONDA PARA AVANÇAR */

        onda.addEventListener("click", function (event) {

            if (!audio.duration) return;

            const largura =
                onda.getBoundingClientRect().width;

            const posicao =
                event.clientX -
                onda.getBoundingClientRect().left;

            audio.currentTime =
                (posicao / largura) *
                audio.duration;

        });


        /* QUANDO A PEÇA TERMINAR */

        audio.addEventListener("ended", function () {

            botaoPlay.textContent = "▶";

        });

    </script>

</body>

</html>
