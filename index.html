
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>Arrudas</title>

    <style>
        :root {
            --cor-arrudas: #1c4354;
        }

        * {
            box-sizing: border-box;
        }

        button,
        input,
        textarea,
        select {
            font-family: "Courier New", monospace;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Trava o scroll indesejado para manter tudo no lugar */
            font-family: "Courier New", monospace;
            color: #222;
            background-color: #d8d0bc; /* Fundo unificado com o mapa */
            user-select: none;
        }

        /* ÁREA DE REFERÊNCIA: MAPA + DESENHO */

        .tela-referencia {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            transform-origin: top left;
            z-index: 1;
        }

        /* MAPA */

        .mapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 1;
            background-color: #d8d0bc;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            pointer-events: auto; /* Permite interagir e dar zoom nativo direto no uMap com segurança */
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
            outline: none !important;
            box-shadow: none !important;
        }

        /* CARREGAMENTO DO TÍTULO E DO ESCUTE */

        .titulo,
        .escute {
            opacity: 1;
            transition: opacity 1.8s ease-out;
        }

        body.carregando .titulo,
        body.carregando .escute {
            opacity: 0;
            visibility: hidden;
            transition: none;
        }

        /* DESENHO DO ARRUDAS — POSIÇÃO PRESERVADA */

        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 110%;
            height: 110%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 2s ease-out 2.2s forwards;
            transform: translate(33px, 33px);
            filter: none;
            background-image: linear-gradient(
                45deg,
                #651b28,
                var(--cor-arrudas)
            );
            -webkit-mask-image: url("desenho_mapa.svg");
            mask-image: url("desenho_mapa.svg");
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        @keyframes entradaDesenho {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* TÍTULO / MENU */

        .titulo {
            position: fixed;
            top: 40px;
            left: 30px;
            z-index: 20;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 25px 40px;
            text-align: center;
            min-width: 420px;
            cursor: pointer;
        }

        .titulo h1 {
            margin: 0;
            font-size: 38px;
            font-weight: bold;
        }

        .titulo p {
            margin: 10px 0 0;
            font-size: 18px;
        }

        /* MENU LATERAL */

        .menu-links {
            position: absolute;
            top: 0;
            left: 100%;
            display: none;
            width: 190px;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 15px 20px;
            text-align: left;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 20px;
            padding: 7px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* ESCUTE */

        .escute {
            position: fixed;
            left: 50%;
            top: 97px;
            transform: translateX(-50%);
            z-index: 30;
            width: 190px;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            gap: 0;
            background-color: rgba(28, 67, 84, 0.20);
            border: none;
            border-radius: 50%;
            font-size: 35px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            opacity: 1;
            visibility: visible;
            transition: opacity 1.8s ease, visibility 0s linear;
        }

        .escute.oculto {
            opacity: 0;
            pointer-events: none;
            transition: opacity 5s ease;
        }

        /* AVISO DE FONES */

        .aviso-fone {
            position: fixed;
            left: 50%;
            top: 97px;
            transform: translateX(-50%);
            z-index: 31;
            width: min(420px, calc(100vw - 32px));
            padding: 18px 24px;
            background-color: rgba(28, 67, 84, 0.9);
            color: #e8e0cf;
            text-align: center;
            font-size: 18px;
            line-height: 1.4;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 1.5s ease, visibility 0s linear 1.5s;
        }

        .aviso-fone.visivel {
            opacity: 1;
            visibility: visible;
            transition: opacity 1.5s ease;
        }

        .aviso-fone.oculto {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease, visibility 0s linear 1.5s;
        }

        /* ORELHA */

        .escute img {
            display: block;
            width: 250px;
            height: 240px;
            object-fit: contain;
            position: relative;
            top: -62px;
        }

        /* PALAVRA ESCUTE */

        .escute span {
            display: block;
            position: relative;
            z-index: 1;
            margin-top: -125px;
        }

        /* PAINEL DE ÁUDIO */

        .audio {
            display: none;
            position: fixed;
            left: 50%;
            top: 292px;
            transform: translateX(-50%);
            z-index: 30;
            width: 92vw;
            max-width: 1500px;
            max-height: calc(100vh - 330px);
            overflow-y: auto;
            background: rgba(232, 224, 207, 0.4);
            border-radius: 12px;
            border: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 22px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .audio.aberto {
            display: block;
        }

        .carregando-audio {
            text-align: center;
            font-size: 16px;
            color: #1c4354;
            padding: 40px 0;
            font-weight: bold;
        }

        .audio.pronto .carregando-audio {
            display: none;
        }

        .fechar-audio,
        .player {
            display: none;
        }

        .audio.pronto .fechar-audio,
        .audio.pronto .player {
            display: block;
            visibility: visible;
        }

        /* FECHAR ÁUDIO */

        .fechar-audio {
            position: absolute;
            top: 4px;
            right: 10px;
            z-index: 10;
            border: none;
            background: transparent;
            padding: 0;
            color: #222;
            font-size: 35px;
            line-height: 1;
            cursor: pointer;
        }

        .fechar-audio:hover {
            color: #85593c;
        }

        .player,
        .waveform-bloco {
            width: 100%;
        }

        /* ONDA SONORA */

        .waveform-visualizacao {
            position: relative;
            width: 100%;
            height: 280px;
            cursor: pointer;
            background: transparent;
            border: none;
            overflow: hidden;
        }

        #waveform {
            width: 100%;
            height: 280px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #waveform.carregado {
            opacity: 1;
        }

        /* PLAY */

        .botao-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(243, 240, 232, 0.75);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            font-size: 21px;
            color: #222;
            cursor: pointer;
        }

        .botao-play:hover {
            background: rgba(243, 240, 232, 0.95);
        }

        /* CONTADOR */

        .controles-waveform {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 14px;
        }

        .tempo {
            font-size: 13px;
            text-align: right;
            flex-shrink: 0;
        }

        /* CELULAR */

        @media (max-width: 600px) {
            .titulo {
                top: 10px;
                left: 10px;
                width: calc(100% - 20px);
                min-width: 0;
                padding: 8px 12px;
            }

            .titulo h1 {
                font-size: 18px;
            }

            .titulo p {
                font-size: 11px;
                margin: 4px 0 0;
            }

            .menu-links {
                top: 100%;
                left: 0;
                width: 100%;
            }

            .escute {
                top: 75px;
                width: 90px;
                height: 90px;
                font-size: 12px;
            }

            .escute img {
                width: 110px;
                height: 105px;
                top: -28px;
            }

            .escute span {
                margin-top: -60px;
            }

            .aviso-fone {
                top: 75px;
                font-size: 13px;
                padding: 10px 14px;
            }

            .audio {
                left: 10px;
                top: 175px;
                transform: none;
                width: calc(100% - 20px);
                max-height: calc(100vh - 190px);
                padding: 15px 10px 10px;
            }

            .waveform-visualizacao,
            #waveform {
                height: 140px !important;
            }

            .botao-play {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body class="carregando">

    <!-- MAPA + DESENHO -->

    <div class="tela-referencia" id="telaReferencia">
        <div class="mapa">
            <iframe
                allowfullscreen
                allow="geolocation"
                src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false&dragging=true">
            </iframe>

            <div class="desenho-arrudas" aria-hidden="true"></div>
        </div>
    </div>

    <!-- TÍTULO / MENU -->

    <div class="titulo" id="titulo">
        <h1>ARRUDAS</h1>
        <p>Memórias Sonoras de um Território-Rio</p>

        <div class="menu-links">
            <a href="sobre.html">Sobre o projeto</a>
            <a href="creditos.html">Ficha técnica</a>
        </div>
    </div>

    <!-- ESCUTE -->

    <div class="escute" id="escute">
        <img src="orelha.png" alt="Orelha — escute">
        <span>ESCUTE</span>
    </div>

    <!-- AVISO DE FONES -->

    <div class="aviso-fone" id="avisoFone" role="status">
        Use fone de ouvido para uma experiência sonora imersiva.
    </div>

    <!-- PLAYER -->

    <div class="audio" id="audioPlayer">
        <div class="carregando-audio" id="carregandoAudio">Carregando composição sonora...</div>

        <button
            class="fechar-audio"
            id="fecharAudio"
            type="button"
            aria-label="Fechar áudio">
            ×
        </button>

        <div class="player">
            <div class="waveform-bloco">
                <div
                    class="waveform-visualizacao"
                    id="waveformVisualizacao">

                    <div id="waveform"></div>

                    <button
                        class="botao-play"
                        id="botaoPlay"
                        aria-label="Reproduzir"
                        type="button">
                        ▶
                    </button>
                </div>

                <div class="controles-waveform">
                    <div class="tempo" id="tempo">00:00 / 00:00</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import WaveSurfer from
            'https://cdn.jsdelivr.net/npm/wavesurfer.js@8/dist/wavesurfer.esm.js';

        const telaReferencia = document.getElementById("telaReferencia");

        function ajustarTelaReferencia() {
            const larguraReferencia = 1920;
            const alturaReferencia = 1080;

            const larguraJanela = window.innerWidth;
            const alturaJanela = window.innerHeight;

            const escala = Math.max(
                larguraJanela / larguraReferencia,
                alturaJanela / alturaReferencia
            );

            const larguraEscalada = larguraReferencia * escala;
            const alturaEscalada = alturaReferencia * escala;

            telaReferencia.style.transform = `scale(${escala})`;
            telaReferencia.style.left = `${(larguraJanela - larguraEscalada) / 2}px`;
            telaReferencia.style.top = `${(alturaJanela - alturaEscalada) / 2}px`;
        }

        ajustarTelaReferencia();

        window.addEventListener("resize", ajustarTelaReferencia);
        window.addEventListener("orientationchange", ajustarTelaReferencia);

        const titulo = document.getElementById("titulo");
        const escute = document.getElementById("escute");
        const avisoFone = document.getElementById("avisoFone");
        const mapaIframe = document.querySelector(".mapa iframe");

        let elementosExibidos = false;

        function mostrarElementos() {
            if (elementosExibidos) {
                return;
            }

            elementosExibidos = true;

            setTimeout(function () {
                document.body.classList.remove("carregando");

                titulo.style.visibility = "visible";
                escute.style.visibility = "visible";

                titulo.style.opacity = "0";
                escute.style.opacity = "0";

                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        titulo.style.opacity = "1";
                        escute.style.opacity = "1";
                    });
                });
            }, 500);
        }

        mapaIframe.addEventListener("load", mostrarElementos, {
            once: true
        });

        setTimeout(mostrarElementos, 3000);

        const audioPlayer = document.getElementById("audioPlayer");
        const fecharAudio = document.getElementById("fecharAudio");
        const botaoPlay = document.getElementById("botaoPlay");
        const tempo = document.getElementById("tempo");

        const waveformVisualizacao =
            document.getElementById("waveformVisualizacao");

        const waveformElemento = document.getElementById("waveform");

        const audioUrl =
            "https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.wav";

        let wavesurfer = null;
        let waveformIniciado = false;
        let avisoFoneTimer = null;
        let avisoFoneTimerIniciado = false;

        titulo.addEventListener("click", function (event) {
            if (event.target.tagName !== "A") {
                titulo.classList.toggle("aberto");
            }
        });

        function formatarTempo(segundos) {
            const minutos = Math.floor(segundos / 60);
            const segundosRestantes = Math.floor(segundos % 60);

            return (
                String(minutos).padStart(2, "0") + ":" +
                String(segundosRestantes).padStart(2, "0")
            );
        }

        function atualizarTempo() {
            if (!wavesurfer) {
                return;
            }

            const duracao = wavesurfer.getDuration();

            if (!duracao || !Number.isFinite(duracao)) {
                return;
            }

            const atual = wavesurfer.getCurrentTime();

            tempo.textContent =
                formatarTempo(atual) + " / " +
                formatarTempo(duracao);
        }

        function iniciarWaveform() {
            if (waveformIniciado) {
                return;
            }

            waveformIniciado = true;

            try {
                const larguraJanela = window.innerWidth;
                const alturaOnda = larguraJanela <= 600 ? (larguraJanela > window.innerHeight ? 120 : 140) : 280;

                wavesurfer = WaveSurfer.create({
                    container: "#waveform",
                    url: audioUrl,
                    height: alturaOnda,
                    waveColor: "#B79A78",
                    progressColor: "#6F7770",
                    cursorWidth: 0,
                    normalize: false,
                    interact: false,
                    barWidth: 2,
                    barGap: 1,
                    barRadius: 3
                });

                wavesurfer.on("ready", function () {
                    audioPlayer.classList.add("pronto");
                    atualizarTempo();

                    requestAnimationFrame(function () {
                        requestAnimationFrame(function () {
                            waveformElemento.classList.add("carregado");
                        });
                    });
                });

                wavesurfer.on("timeupdate", atualizarTempo);

                wavesurfer.on("play", function () {
                    botaoPlay.textContent = "Ⅱ";
                    botaoPlay.setAttribute("aria-label", "Pausar");

                    if (
                        !avisoFoneTimerIniciado &&
                        avisoFone.classList.contains("visivel")
                    ) {
                        avisoFoneTimerIniciado = true;

                        avisoFoneTimer = setTimeout(function () {
                            avisoFone.classList.remove("visivel");
                            avisoFone.classList.add("oculto");
                        }, 15000);
                    }
                });

                wavesurfer.on("pause", function () {
                    botaoPlay.textContent = "▶";
                    botaoPlay.setAttribute("aria-label", "Reproduzir");
                });

                wavesurfer.on("finish", function () {
                    botaoPlay.textContent = "▶";
                    botaoPlay.setAttribute("aria-label", "Reproduzir");
                    atualizarTempo();
                });

                wavesurfer.on("error", function (erro) {
                    console.error("Erro no WaveSurfer:", erro);
                });

            } catch (erro) {
                console.error("Erro ao iniciar o WaveSurfer:", erro);
            }
        }

        escute.addEventListener("click", function () {
            escute.style.removeProperty("opacity");
            escute.classList.add("oculto");
            audioPlayer.classList.add("aberto");

            if (avisoFoneTimer !== null) {
                clearTimeout(avisoFoneTimer);
            }

            avisoFoneTimer = null;
            avisoFoneTimerIniciado = false;

            avisoFone.classList.remove("oculto");
            avisoFone.classList.add("visivel");

            requestAnimationFrame(() => {
                iniciarWaveform();
                if (wavesurfer) {
                    setTimeout(() => wavesurfer.zoom(wavesurfer.options.minPxPerSec || 0), 100);
                }
            });
        });

        fecharAudio.addEventListener("click", function () {
            if (wavesurfer) {
                wavesurfer.pause();
            }

            audioPlayer.classList.remove("aberto");
            escute.classList.remove("oculto");

            if (avisoFoneTimer !== null) {
                clearTimeout(avisoFoneTimer);
            }

            avisoFoneTimer = null;
            avisoFoneTimerIniciado = false;

            avisoFone.classList.remove("visivel", "oculto");
        });

        botaoPlay.addEventListener("click", async function (event) {
            event.stopPropagation();

            if (!waveformIniciado) {
                iniciarWaveform();
                return;
            }

            if (wavesurfer) {
                try {
                    await wavesurfer.playPause();
                } catch (erro) {
                    console.error("Erro na reprodução:", erro);
                }
            }
        });

        waveformVisualizacao.addEventListener("click", function (event) {
            linkPlayer: {
                if (
                    event.target === botaoPlay ||
                    !wavesurfer ||
                    !wavesurfer.getDuration()
                ) {
                    break linkPlayer;
                }

                const area = waveformVisualizacao.getBoundingClientRect();
                const posicao = event.clientX - area.left;

                const proporcao = Math.max(
                    0,
                    Math.min(1, posicao / area.width)
                );

                wavesurfer.seekTo(proporcao);
                atualizarTempo();
            }
        });
    </script>
</body>
</html>
