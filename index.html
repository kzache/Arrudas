<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto Arrudas</title>

    <style>

        /* Configurações gerais da página */

        body {
            margin: 0;
            padding: 0;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: #f3f0e8;
        }


        /* Menu */

        .menu {
            position: absolute;
            top: 25px;
            right: 30px;
        }

        .menu-button {
            background: none;
            border: none;
            font-family: "Courier New", monospace;
            font-size: 28px;
            cursor: pointer;
            color: #222;
        }


        /* Opções do menu */

        .menu-content {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background-color: #f3f0e8;
            padding: 15px 20px;
            border: 1px solid #222;
            min-width: 180px;
        }

        .menu-content a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 15px;
            padding: 8px 0;
        }

        .menu-content a:hover {
            text-decoration: underline;
        }


        /* O menu aparece quando clicamos */

        .menu:hover .menu-content {
            display: block;
        }


        /* Conteúdo principal */

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 30px 60px;
        }


        /* Título */

        h1 {
            text-align: center;
            font-size: 42px;
            font-weight: normal;
            margin-bottom: 10px;
        }


        /* Subtítulo */

        .subtitulo {
            text-align: center;
            font-size: 20px;
            margin-bottom: 60px;
        }


        /* Vídeo */

        .video {
            display: flex;
            justify-content: center;
        }

        .video iframe {
            width: 80%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            border: none;
        }


        /* Ajustes para telas pequenas */

        @media (max-width: 600px) {

            .menu {
                top: 20px;
                right: 20px;
            }

            main {
                padding: 80px 20px 50px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitulo {
                font-size: 18px;
                margin-bottom: 40px;
            }

            .video iframe {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- MENU -->

    <div class="menu">

        <button class="menu-button">☰</button>

        <div class="menu-content">

            <a href="sobre.html">Sobre o projeto</a>

            <a href="creditos.html">Créditos</a>

        </div>

    </div>


    <!-- CONTEÚDO PRINCIPAL -->

    <main>

        <h1>PROJETO ARRUDAS</h1>

        <p class="subtitulo">
            Uma investigação sonora sobre o Ribeirão Arrudas
        </p>


        <!-- VÍDEO -->

        <div class="video">

            <iframe
                src="https://player.vimeo.com/video/1227748314?title=0&byline=0&portrait=0"
                title="Projeto Arrudas"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>

        </div>

    </main>


</body>

</html>
