<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            color: #222;
        }

        /* MAPA */

        .mapa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        /* DESENHO DO ARRUDAS */

        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 122%;
            height: 122%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 1.8s ease-out 1.5s forwards;
            transform: translate(-170px, -3px);
        }

        @keyframes entradaDesenho {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* CAIXA DO TÍTULO / MENU */

        .titulo {
            position: fixed;
            top: 40px;
            left: 30px;
            z-index: 20;

            background-color: rgba(243, 240, 232, 0.94);

            padding: 25px 40px;
            text-align: center;
            min-width: 420px;

            cursor: pointer;
        }

        .titulo h1 {
            margin: 0;
            font-size: 38px;
            font-weight: normal;
        }

        .titulo p {
            margin: 10px 0 0;
            font-size: 18px;
        }

        /* MENU LATERAL */

        .menu-links {
            position: absolute;

            top: 0;
            left: 100%;

            display: none;

            width: 190px;

            background-color: rgba(243, 240, 232, 0.94);

            padding: 15px 20px;

            text-align: left;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;

            text-decoration: none;
            color: #222;

            font-size: 15px;

            padding: 7px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* ESCUTE */

        .escute {
            position: fixed;

            left: 30px;
            top: 190px;

            z-index: 30;

            width: 420px;

            padding: 16px 20px;

            background-color: #f3f0e8;

            font-family: "Courier New", monospace;
            font-size: 20px;
            font-weight: bold;

            text-align: center;

            cursor: pointer;
        }

        /* PLAYER */

        .audio {
            display: none;

            position: fixed;

            left: 30px;
            top: 245px;

            z-index: 30;

            width: 420px;

            background-color: #f3f0e8;

        .player {
            width: 100%;

        .player-controles {
            display: flex;
            align-items: center;

        /* BOTÃO PLAY */

        .botao-play {
            width: 32px;
            height: 32px;

            padding: 0;

            background-color: #f3f0e8;

            font-family: "Courier New", monospace;
            font-size: 15px;

            color: #222;

            cursor: pointer;

            flex-shrink: 0;
        }

        /* ÁREA DO ESPECTROGRAMA */

        .onda {
            position: relative;

            flex: 1;

            height: 45px;

            cursor: pointer;

            overflow: hidden;

            background-color: transparent;
        }

        /* CANVAS DO ESPECTROGRAMA */

        #espectrograma {
            display: block;

            width: 100%;
            height: 100%;
        }

        /* LINHA DO MOMENTO ATUAL */

        .linha-atual {
            position: absolute;

            top: 0;

            opacity: 0.8;

        /* TEMPO */

        .tempo {

            font-size: 13px;

            text-align: right;

            flex-shrink: 0;
        }

        /* ESCONDE O ÁUDIO NATIVO */

        #audio {
            display: none;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            .titulo {
                top: 25px;
                left: 15px;

                width: calc(100% - 100px);

            }

        }

        /* COR DO MAPA */

        .mapa iframe {
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
        }

    </style>

</head>

<body>

    <!-- MAPA -->

    <div class="mapa">

        <iframe
            allowfullscreen
            allow="geolocation"
            src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false">
        </iframe>

        <img
            class="desenho-arrudas"
            src="desenho_mapa.svg"
            alt=""
        >

    </div>


    <!-- TÍTULO / MENU -->

    <div class="titulo" id="titulo">

        <h1>Arrudas</h1>

        <p>Memórias Sonoras de um Território-Rio</p>

        <div class="menu-links">

            <a href="sobre.html">Sobre o projeto</a>

            <a href="creditos.html">Ficha técnica</a>

        </div>

    </div>


    <!-- ESCUTE -->

    <div class="escute" id="escute">

        ESCUTE

    </div>


    <!-- PLAYER -->

    <div class="audio" id="audioPlayer">

        <div class="player">

            <audio
                id="audio"
                preload="metadata"
                controlsList="nodownload noplaybackrate">

                <source
                    src="Arrudas_Peça Sonora_.mp3"
                    type="audio/mpeg">

            </audio>


            <div class="player-controles">

                <button
                    class="botao-play"
                    id="botaoPlay"
                    aria-label="Reproduzir">

                    ▶

                </button>


                <div
                    class="onda"
                    id="onda">

                    <canvas
                        id="espectrograma">
                    </canvas>

                    <div
                        class="linha-atual">
                    </div>

                </div>


                <div
                    class="tempo"
                    id="tempo">

                    00:00

                </div>

            </div>

        </div>

    </div>


    <!-- INTERAÇÕES -->

    <script>

        /* CAIXA DO TÍTULO / MENU */

        const titulo = document.getElementById("titulo");

        titulo.addEventListener("click", function (event) {

            if (event.target.tagName !== "A") {

                titulo.classList.toggle("aberto");

            }

        });


        /* ESCUTE / PLAYER */

        const escute = document.getElementById("escute");
        const audioPlayer = document.getElementById("audioPlayer");

        escute.addEventListener("click", function () {

            audioPlayer.classList.toggle("aberto");

        });


        /* ELEMENTOS DO PLAYER */

        const audio = document.getElementById("audio");
        const botaoPlay = document.getElementById("botaoPlay");
        const onda = document.getElementById("onda");
        const canvas = document.getElementById("espectrograma");
        const contexto = canvas.getContext("2d");
        const tempo = document.getElementById("tempo");


        /* CONFIGURAÇÃO DO ESPECTROGRAMA */

        let analisador = null;
        let dadosFrequencia = null;
        let audioContext = null;
        let fonteAudio = null;

        let espectrogramaIniciado = false;


        /* AJUSTA O TAMANHO DO CANVAS */

        function ajustarCanvas() {

            const largura =
                onda.clientWidth;

            const altura =
                onda.clientHeight;

            const escala =
                window.devicePixelRatio || 1;

            canvas.width =
                largura * escala;

            canvas.height =
                altura * escala;

            canvas.style.width =
                largura + "px";

            canvas.style.height =
                altura + "px";

            contexto.setTransform(
                escala,
                0,
                0,
                escala,
                0,
                0
            );

        }


        ajustarCanvas();

        window.addEventListener(
            "resize",
            ajustarCanvas
        );


        /* CRIA A ANÁLISE DO ÁUDIO */

        function iniciarAnalise() {

            if (espectrogramaIniciado) {

                return;

            }


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            analisador =
                audioContext.createAnalyser();


            analisador.fftSize = 256;

            analisador.smoothingTimeConstant = 0.35;


            dadosFrequencia =
                new Uint8Array(
                    analisador.frequencyBinCount
                );


            fonteAudio =
                audioContext.createMediaElementSource(
                    audio
                );


            fonteAudio.connect(analisador);

            analisador.connect(
                audioContext.destination
            );


            espectrogramaIniciado = true;

        }


        /* DESENHA UMA NOVA COLUNA */

        function desenharEspectrograma() {

            if (!analisador) {

                return;

            }


            const largura =
                onda.clientWidth;

            const altura =
                onda.clientHeight;


            analisador.getByteFrequencyData(
                dadosFrequencia
            );


            /*
             * Move o espectrograma existente
             * uma pequena distância para a esquerda.
             */

            contexto.drawImage(
                canvas,
                -1,
                0,
                largura,
                altura
            );


            /*
             * Limpa apenas a nova coluna
             * que entrou pela direita.
             */

            contexto.clearRect(
                largura - 2,
                0,
                2,
                altura
            );


            /*
             * Desenha as frequências do som
             * na nova coluna.
             */

            const novaColuna =
                largura - 2;


            const quantidade =
                dadosFrequencia.length;


            const larguraFaixa =
                altura / quantidade;


            for (
                let i = 0;
                i < quantidade;
                i++
            ) {

                const valor =
                    dadosFrequencia[i];


                /*
                 * Inverte a frequência para que
                 * as frequências graves fiquem
                 * embaixo.
                 */

                const y =
                    altura -
                    ((i + 1) * larguraFaixa);


                /*
                 * Intensidade mínima para
                 * evitar uma tela completamente vazia.
                 */

                const intensidade =
                    valor / 255;


                /*
                 * Tons neutros/terrosos.
                 * A intensidade do som controla
                 * a transparência.
                 */

                contexto.fillStyle =
                    "rgba(34, 34, 34, " +
                    (intensidade * 0.9) +
                    ")";


                contexto.fillRect(
                    novaColuna,
                    y,
                    2,
                    Math.max(
                        1,
                        larguraFaixa + 0.5
                    )
                );

            }


            requestAnimationFrame(
                desenharEspectrograma
            );

        }


        /* PLAY / PAUSA */

        botaoPlay.addEventListener(
            "click",
            async function () {

                iniciarAnalise();


                if (
                    audioContext &&
                    audioContext.state === "suspended"
                ) {

                    await audioContext.resume();

                }


                if (audio.paused) {

                    await audio.play();

                    botaoPlay.textContent = "Ⅱ";

                    desenharEspectrograma();

                } else {

                    audio.pause();

                    botaoPlay.textContent = "▶";

                }

            }
        );


        /* ATUALIZA O TEMPO */

        audio.addEventListener(
            "timeupdate",
            function () {

                if (!audio.duration) {

                    return;

                }


                const minutos =
                    Math.floor(
                        audio.currentTime / 60
                    );


                const segundos =
                    Math.floor(
                        audio.currentTime % 60
                    );


                tempo.textContent =
                    String(minutos).padStart(
                        2,
                        "0"
                    ) +
                    ":" +
                    String(segundos).padStart(
                        2,
                        "0"
                    );

            }
        );


        /* CLICAR NO ESPECTROGRAMA PARA AVANÇAR */

        onda.addEventListener(
            "click",
            function (event) {

                if (!audio.duration) {

                    return;

                }


                const largura =
                    onda.getBoundingClientRect().width;


                const posicao =
                    event.clientX -
                    onda.getBoundingClientRect().left;


                audio.currentTime =
                    (posicao / largura) *
                    audio.duration;

            }
        );


        /* QUANDO A PEÇA TERMINAR */

        audio.addEventListener(
            "ended",
            function () {

                botaoPlay.textContent = "▶";

            }
        );

    </script>

</body>

</html>
