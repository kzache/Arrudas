
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Arrudas</title>

    <style>
        :root {
            --cor-arrudas: #1c4354;
        }

        * {
            box-sizing: border-box;
        }

        button,
        input,
        textarea,
        select {
            font-family: "Courier New", monospace;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: #d8d0bc;
            user-select: none;
            touch-action: none;
        }

        /* ÁREA DE REFERÊNCIA GLOBAL (MAPA + DESENHO + ELEMENTOS) */
        .tela-referencia {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            transform-origin: 0 0;
            z-index: 1;
            background-color: #d8d0bc;
            will-change: transform;
        }

        /* MAPA */
        .mapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 1;
            background-color: #d8d0bc;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            pointer-events: none;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%) !important;
            outline: none !important;
            box-shadow: none !important;
        }

        /* DESENHO DO ARRUDAS */
        .desenho-arrudas {
            position: absolute;
            top: 3%;
            left: -6%;
            width: 110%;
            height: 110%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 2s ease-out 2.2s forwards;
            transform: translate(33px, 33px);
            filter: none;
            background-image: linear-gradient(
                45deg,
                #651b28,
                var(--cor-arrudas)
            );
            -webkit-mask-image: url("desenho_mapa.svg");
            mask-image: url("desenho_mapa.svg");
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }

        @keyframes entradaDesenho {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* TÍTULO / MENU (PADRÃO DESKTOP) */
        .titulo {
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 20;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 25px 40px;
            text-align: center;
            min-width: 420px;
            cursor: pointer;
        }

        .titulo h1 {
            margin: 0;
            font-size: 38px;
            font-weight: bold;
        }

        .titulo p {
            margin: 10px 0 0;
            font-size: 18px;
        }

        .menu-links {
            position: absolute;
            top: 0;
            left: 100%;
            display: none;
            width: 190px;
            background-color: rgba(243, 240, 232, 0.94);
            padding: 15px 20px;
            text-align: left;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 20px;
            padding: 7px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* ESCUTE (PADRÃO DESKTOP) */
        .escute {
            position: absolute;
            left: 960px;
            top: 80px;
            transform: translateX(-50%);
            z-index: 30;
            width: 190px;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background-color: rgba(28, 67, 84, 0.20);
            border: none;
            border-radius: 50%;
            font-size: 35px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            opacity: 1;
            visibility: visible;
            transition: opacity 1.8s ease;
        }

        .escute.oculto {
            opacity: 0;
            pointer-events: none;
        }

        .escute img {
            display: block;
            width: 250px;
            height: 240px;
            object-fit: contain;
            position: relative;
            top: -62px;
        }

        .escute span {
            display: block;
            position: relative;
            z-index: 1;
            margin-top: -125px;
        }

        /* AVISO DE FONES */
        .aviso-fone {
            position: absolute;
            left: 960px;
            top: 80px;
            transform: translateX(-50%);
            z-index: 31;
            width: 420px;
            padding: 18px 24px;
            background-color: rgba(28, 67, 84, 0.9);
            color: #e8e0cf;
            text-align: center;
            font-size: 18px;
            line-height: 1.4;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 1.5s ease, visibility 0s linear 1.5s;
        }

        .aviso-fone.visivel {
            opacity: 1;
            visibility: visible;
            transition: opacity 1.5s ease;
        }

        .aviso-fone.oculto {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease, visibility 0s linear 1.5s;
        }

        /* PAINEL DE ÁUDIO (PADRÃO DESKTOP) */
        .audio {
            display: none;
            position: absolute;
            left: 210px;
            top: 320px;
            z-index: 30;
            width: 1500px;
            background: rgba(232, 224, 207, 0.85);
            border-radius: 12px;
            padding: 22px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .audio.aberto {
            display: block;
        }

        .carregando-audio {
            text-align: center;
            font-size: 18px;
            color: #1c4354;
            padding: 40px 0;
            font-weight: bold;
        }

        .audio.pronto .carregando-audio {
            display: none;
        }

        .fechar-audio,
        .player {
            display: none;
        }

        .audio.pronto .fechar-audio,
        .audio.pronto .player {
            display: block;
            visibility: visible;
        }

        .fechar-audio {
            position: absolute;
            top: 4px;
            right: 10px;
            z-index: 10;
            border: none;
            background: transparent;
            padding: 0;
            color: #222;
            font-size: 35px;
            line-height: 1;
            cursor: pointer;
        }

        .player,
        .waveform-bloco {
            width: 100%;
        }

        .waveform-visualizacao {
            position: relative;
            width: 100%;
            height: 280px;
            cursor: pointer;
            background: transparent;
            border: none;
            overflow: hidden;
        }

        #waveform {
            width: 100%;
            height: 280px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #waveform.carregado {
            opacity: 1;
        }

        .botao-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            border: none;
            border-radius: 50%;
            background: rgba(243, 240, 232, 0.9);
            font-size: 21px;
            color: #222;
            cursor: pointer;
        }

        .controles-waveform {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 14px;
        }

        .tempo {
            font-size: 15px;
            text-align: right;
        }

        /* ========================================================
           PERSONALIZAÇÃO EXCLUSIVA PARA CELULAR (VERTICAL / HORIZONTAL)
           ======================================================== */
        @media (max-width: 850px) {
            
            /* Título menor e reposicionado para não estourar a tela */
            .titulo {
                top: 40px;
                left: 40px;
                padding: 15px 25px;
                min-width: 320px;
            }
            .titulo h1 {
                font-size: 26px;
            }
            .titulo p {
                font-size: 13px;
            }

            /* Botão ESCUTE maior e destacado conforme solicitado */
            .escute {
                width: 260px;
                height: 260px;
                font-size: 45px;
                /* Exemplo na vertical: posicionado mais abaixo do título */
                left: 960px;
                top: 380px; 
            }
            .escute img {
                width: 330px;
                height: 310px;
                top: -80px;
            }
            .escute span {
                margin-top: -160px;
            }

            /* Aviso de fones adaptado à proporção */
            .aviso-fone {
                left: 960px;
                top: 380px;
                width: 550px;
                font-size: 22px;
            }

            /* Painel de áudio dimensionado perfeitamente dentro da tela de referência */
            .audio {
                left: 110px;
                top: 350px;
                width: 1700px;
                padding: 30px;
            }
            .waveform-visualizacao,
            #waveform {
                height: 240px !important;
            }
            .botao-play {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }
        }
    </style>
</head>

<body class="carregando">

    <div class="tela-referencia" id="telaReferencia">
        
        <div class="mapa">
            <iframe
                allowfullscreen
                allow="geolocation"
                src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=false&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false&dragging=false">
            </iframe>

            <div class="desenho-arrudas" aria-hidden="true"></div>
        </div>

        <div class="titulo" id="titulo">
            <h1>ARRUDAS</h1>
            <p>Memórias Sonoras de um Território-Rio</p>

            <div class="menu-links">
                <a href="sobre.html">Sobre o projeto</a>
                <a href="creditos.html">Ficha técnica</a>
            </div>
        </div>

        <div class="escute" id="escute">
            <img src="orelha.png" alt="Orelha — escute">
            <span>ESCUTE</span>
        </div>

        <div class="aviso-fone" id="avisoFone" role="status">
            Use fone de ouvido para uma experiência sonora imersiva.
        </div>

        <div class="audio" id="audioPlayer">
            <div class="carregando-audio" id="carregandoAudio">Carregando composição sonora...</div>

            <button
                class="fechar-audio"
                id="fecharAudio"
                type="button"
                aria-label="Fechar áudio">
                ×
            </button>

            <div class="player">
                <div class="waveform-bloco">
                    <div
                        class="waveform-visualizacao"
                        id="waveformVisualizacao">

                        <div id="waveform"></div>

                        <button
                            class="botao-play"
                            id="botaoPlay"
                            aria-label="Reproduzir"
                            type="button">
                            ▶
                        </button>
                    </div>

                    <div class="controles-waveform">
                        <div class="tempo" id="tempo">00:00 / 00:00</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import WaveSurfer from
            'https://cdn.jsdelivr.net/npm/wavesurfer.js@8/dist/wavesurfer.esm.js';

        const telaReferencia = document.getElementById("telaReferencia");

        let escalaAtual = 1;
        let escalaBaseMinima = 1;
        let posX = 0;
        let posY = 0;

        const larguraRef = 1920;
        const alturaRef = 1080;

        function atualizarTransformacao() {
            telaReferencia.style.transform = `translate(${posX}px, ${posY}px) scale(${escalaAtual})`;
        }

        function inicializarPosicao() {
            const wWin = window.innerWidth;
            const hWin = window.innerHeight;

            escalaBaseMinima = Math.max(wWin / larguraRef, hWin / alturaRef);
            
            if (escalaAtual < escalaBaseMinima) {
                escalaAtual = escalaBaseMinima;
            }

            const wEscalado = larguraRef * escalaAtual;
            const hEscalado = alturaRef * escalaAtual;

            posX = Math.min(0, Math.max(wWin - wEscalado, posX));
            posY = Math.min(0, Math.max(hWin - hEscalado, posY));

            atualizarTransformacao();
        }

        inicializarPosicao();

        window.addEventListener("resize", () => {
            inicializarPosicao();
        });

        window.addEventListener("orientationchange", () => {
            setTimeout(inicializarPosicao, 300);
        });

        let toquesAtivos = [];
        let distanciaInicial = 0;
        let escalaInicial = 1;
        let ultimoX = 0;
        let ultimoY = 0;

        document.addEventListener("touchstart", (e) => {
            toquesAtivos = Array.from(e.touches);
            if (toquesAtivos.length === 1) {
                ultimoX = toquesAtivos[0].clientX;
                ultimoY = toquesAtivos[0].clientY;
            } else if (toquesAtivos.length === 2) {
                distanciaInicial = Math.hypot(
                    toquesAtivos[0].clientX - toquesAtivos[1].clientX,
                    toquesAtivos[0].clientY - toquesAtivos[1].clientY
                );
                escalaInicial = escalaAtual;
            }
        }, { passive: false });

        document.addEventListener("touchmove", (e) => {
            e.preventDefault();
            toquesAtivos = Array.from(e.touches);

            const wWin = window.innerWidth;
            const hWin = window.innerHeight;
            const wEscalado = larguraRef * escalaAtual;
            const hEscalado = alturaRef * escalaAtual;

            if (toquesAtivos.length === 1) {
                const x = toquesAtivos[0].clientX;
                const y = toquesAtivos[0].clientY;

                posX += x - ultimoX;
                posY += y - ultimoY;

                const limiteX = wWin - wEscalado;
                const limiteY = hWin - hEscalado;

                posX = Math.min(0, Math.max(limiteX, posX));
                posY = Math.min(0, Math.max(limiteY, posY));

                ultimoX = x;
                ultimoY = y;

                atualizarTransformacao();
            } 
            else if (toquesAtivos.length === 2) {
                const distanciaAtual = Math.hypot(
                    toquesAtivos[0].clientX - toquesAtivos[1].clientX,
                    toquesAtivos[0].clientY - toquesAtivos[1].clientY
                );

                if (distanciaInicial > 0) {
                    let novaEscala = escalaInicial * (distanciaAtual / distanciaInicial);
                    
                    if (novaEscala < escalaBaseMinima) novaEscala = escalaBaseMinima;
                    if (novaEscala > escalaBaseMinima * 3) novaEscala = escalaBaseMinima * 3;

                    escalaAtual = novaEscala;
                    atualizarTransformacao();
                }
            }
        }, { passive: false });

        document.addEventListener("touchend", (e) => {
            toquesAtivos = Array.from(e.touches);
        });

        const titulo = document.getElementById("titulo");
        const escute = document.getElementById("escute");
        const avisoFone = document.getElementById("avisoFone");
        const mapaIframe = document.querySelector(".mapa iframe");

        let elementosExibidos = false;

        function mostrarElementos() {
            if (elementosExibidos) return;
            elementosExibidos = true;

            setTimeout(function () {
                document.body.classList.remove("carregando");
                titulo.style.visibility = "visible";
                escute.style.visibility = "visible";
                titulo.style.opacity = "1";
                escute.style.opacity = "1";
            }, 500);
        }

        mapaIframe.addEventListener("load", mostrarElementos, { once: true });
        setTimeout(mostrarElementos, 3000);

        const audioPlayer = document.getElementById("audioPlayer");
        const fecharAudio = document.getElementById("fecharAudio");
        const botaoPlay = document.getElementById("botaoPlay");
        const tempo = document.getElementById("tempo");
        const waveformVisualizacao = document.getElementById("waveformVisualizacao");
        const waveformElemento = document.getElementById("waveform");

        const audioUrl = "https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.wav";

        let wavesurfer = null;
        let waveformIniciado = false;
        let avisoFoneTimer = null;
        let avisoFoneTimerIniciado = false;

        titulo.addEventListener("click", function (event) {
            if (event.target.tagName !== "A") {
                titulo.classList.toggle("aberto");
            }
        });

        function formatarTempo(segundos) {
            const minutos = Math.floor(segundos / 60);
            const segundosRestantes = Math.floor(segundos % 60);
            return String(minutos).padStart(2, "0") + ":" + String(segundosRestantes).padStart(2, "0");
        }

        function atualizarTempo() {
            if (!wavesurfer) return;
            const duracao = wavesurfer.getDuration();
            if (!duracao || !Number.isFinite(duracao)) return;
            const atual = wavesurfer.getCurrentTime();
            tempo.textContent = formatarTempo(atual) + " / " + formatarTempo(duracao);
        }

        function iniciarWaveform() {
            if (waveformIniciado) return;
            waveformIniciado = true;

            try {
                wavesurfer = WaveSurfer.create({
                    container: "#waveform",
                    url: audioUrl,
                    height: 240,
                    waveColor: "#B79A78",
                    progressColor: "#6F7770",
                    cursorWidth: 0,
                    normalize: false,
                    interact: false,
                    barWidth: 2,
                    barGap: 1,
                    barRadius: 3
                });

                wavesurfer.on("ready", function () {
                    audioPlayer.classList.add("pronto");
                    atualizarTempo();
                    waveformElemento.classList.add("carregado");
                });

                wavesurfer.on("timeupdate", atualizarTempo);

                wavesurfer.on("play", function () {
                    botaoPlay.textContent = "Ⅱ";
                    if (!avisoFoneTimerIniciado && avisoFone.classList.contains("visivel")) {
                        avisoFoneTimerIniciado = true;
                        avisoFoneTimer = setTimeout(() => {
                            avisoFone.classList.remove("visivel");
                            avisoFone.classList.add("oculto");
                        }, 15000);
                    }
                });

                wavesurfer.on("pause", () => botaoPlay.textContent = "▶");
                wavesurfer.on("finish", () => { botaoPlay.textContent = "▶"; atualizarTempo(); });
            } catch (erro) {
                console.error("Erro no WaveSurfer:", erro);
            }
        }

        escute.addEventListener("click", function () {
            escute.classList.add("oculto");
            audioPlayer.classList.add("aberto");

            if (avisoFoneTimer !== null) clearTimeout(avisoFoneTimer);
            avisoFoneTimer = null;
            avisoFoneTimerIniciado = false;

            avisoFone.classList.remove("oculto");
            avisoFone.classList.add("visivel");

            iniciarWaveform();
        });

        fecharAudio.addEventListener("click", function () {
            if (wavesurfer) wavesurfer.pause();
            audioPlayer.classList.remove("aberto");
            escute.classList.remove("oculto");

            if (avisoFoneTimer !== null) clearTimeout(avisoFoneTimer);
            avisoFoneTimer = null;
            avisoFoneTimerIniciado = false;

            avisoFone.classList.remove("visivel", "oculto");
        });

        botaoPlay.addEventListener("click", async function (event) {
            event.stopPropagation();
            if (!waveformIniciado) {
                iniciarWaveform();
                return;
            }
            if (wavesurfer) await wavesurfer.playPause();
        });

        waveformVisualizacao.addEventListener("click", function (event) {
            if (event.target === botaoPlay || !wavesurfer || !wavesurfer.getDuration()) return;
            const area = waveformVisualizacao.getBoundingClientRect();
            const proporcao = Math.max(0, Math.min(1, (event.clientX - area.left) / area.width));
            wavesurfer.seekTo(proporcao);
            atualizarTempo();
        });
    </script>
</body>
</html>
