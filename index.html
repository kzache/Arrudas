
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Arrudas - Memórias Sonoras de um Território-Rio</title>

    <style>
        :root {
            --cor-arrudas: #1c4354;
            --cor-fundo: #d8d0bc;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: var(--cor-fundo);
        }

        /* CONTAINER GLOBAL RESPONSIVO */
        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* MAPA DE FUNDO */
        .mapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: var(--cor-fundo);
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto; /* Permite zoom e navegação natural no mapa */
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%);
        }

        /* DESENHO DO ARRUDAS (Sobreposto ao mapa) */
        .desenho-arrudas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 2s ease-out 1s forwards;
            background-image: linear-gradient(
                45deg,
                #651b28,
                var(--cor-arrudas)
            );
            -webkit-mask-image: url("desenho_mapa.svg");
            mask-image: url("desenho_mapa.svg");
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: contain;
            mask-size: contain;
        }

        @keyframes entradaDesenho {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* CAMADA DE INTERFACE (UI) */
        .interface-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Deixa cliques passarem para o mapa onde não há elementos */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .interface-ui > * {
            pointer-events: auto; /* Restaura cliques nos elementos da interface */
        }

        /* TÍTULO DO PROJETO */
        .titulo {
            background-color: rgba(243, 240, 232, 0.94);
            padding: 20px 30px;
            border-radius: 8px;
            max-width: 420px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            align-self: flex-start;
        }

        .titulo h1 {
            margin: 0;
            font-size: clamp(24px, 3vw, 36px);
            font-weight: bold;
        }

        .titulo p {
            margin: 8px 0 0;
            font-size: clamp(14px, 1.5vw, 18px);
        }

        .menu-links {
            display: none;
            margin-top: 15px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 18px;
            padding: 5px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* CENTRO: BOTÃO ESCUTE E AVISO */
        .centro-acao {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .escute {
            width: 170px;
            height: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(28, 67, 84, 0.25);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease, opacity 1s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .escute:hover {
            transform: translate(-50%, -50%) scale(1.05);
            background-color: rgba(28, 67, 84, 0.35);
        }

        .escute.oculto {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .escute img {
            width: 200px;
            height: 180px;
            object-fit: contain;
            margin-top: -25px;
        }

        .escute span {
            font-size: 26px;
            font-weight: bold;
            color: var(--cor-arrudas);
            margin-top: -85px;
            z-index: 2;
        }

        /* AVISO DE FONES */
        .aviso-fone {
            background-color: rgba(28, 67, 84, 0.9);
            color: #e8e0cf;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            max-width: 420px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .aviso-fone.visivel {
            opacity: 1;
            visibility: visible;
        }

        /* PAINEL DE ÁUDIO INFERIOR */
        .audio-painel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background-color: rgba(243, 240, 232, 0.96);
            padding: 20px 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .audio-painel.aberto {
            display: block;
        }

        .fechar-audio {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #555;
        }

        .player-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-right: 20px;
        }

        .player-conteudo {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .botao-play {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--cor-arrudas);
            color: #fff;
            border: none;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .barra-progresso-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--cor-arrudas);
            cursor: pointer;
            height: 6px;
        }

        .tempos-info {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            color: #333;
        }

        /* ONDA SONORA ANIMADA EM CSS */
        .onda-sonora {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 25px;
            padding: 0 5px;
        }

        .onda-sonora .barra {
            width: 4px;
            height: 6px;
            background-color: #B79A78;
            border-radius: 2px;
            transition: height 0.2s ease;
        }

        .onda-sonora.rodando .barra:nth-child(1) { animation: ondaAnim 0.7s infinite ease-in-out; }
        .onda-sonora.rodando .barra:nth-child(2) { animation: ondaAnim 0.4s infinite ease-in-out 0.1s; }
        .onda-sonora.rodando .barra:nth-child(3) { animation: ondaAnim 0.6s infinite ease-in-out 0.2s; }
        .onda-sonora.rodando .barra:nth-child(4) { animation: ondaAnim 0.5s infinite ease-in-out 0.3s; }
        .onda-sonora.rodando .barra:nth-child(5) { animation: ondaAnim 0.8s infinite ease-in-out 0.4s; }

        @keyframes ondaAnim {
            0%, 100% { height: 6px; }
            50% { height: 26px; }
        }

        /* RESPONSIVIDADE FLUIDA PARA CELULARES */
        @media (max-width: 768px) {
            .interface-ui {
                padding: 15px;
            }
            .titulo {
                max-width: 100%;
                padding: 15px 20px;
            }
            .titulo h1 { font-size: 22px; }
            .titulo p { font-size: 13px; }

            .escute {
                width: 150px;
                height: 150px;
            }
            .escute img {
                width: 170px;
                height: 150px;
            }
            .escute span {
                font-size: 22px;
                margin-top: -75px;
            }
            .audio-painel {
                bottom: 15px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- MAPA DE FUNDO -->
        <div class="mapa">
            <iframe src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false&dragging=true"></iframe>
        </div>

        <!-- DESENHO ARTÍSTICO DO ARRUDAS POR CIMA DO MAPA -->
        <div class="desenho-arrudas" aria-hidden="true"></div>

        <!-- INTERFACE DE ELEMENTOS FLUTUANTES -->
        <div class="interface-ui">
            
            <!-- TÍTULO -->
            <div class="titulo" id="titulo">
                <h1>ARRUDAS</h1>
                <p>Memórias Sonoras de um Território-Rio</p>
                <div class="menu-links">
                    <a href="sobre.html">Sobre o projeto</a>
                </div>
            </div>

            <!-- CENTRO (BOTÃO ESCUTE + AVISO) -->
            <div class="centro-acao">
                <button class="escute" id="escute">
                    <img src="orelha.png" alt="Orelha">
                    <span>ESCUTE</span>
                </button>

                <div class="aviso-fone" id="avisoFone">
                    Para uma experiência sonora imersiva, use fones de ouvido.
                </div>
            </div>

            <!-- PAINEL DE ÁUDIO INFERIOR -->
            <div class="audio-painel" id="audioPainel">
                <button class="fechar-audio" id="fecharAudio">×</button>
                
                <div class="player-topo">
                    <div style="font-weight: bold; font-size: 16px; color: var(--cor-arrudas);">Peça Sonora - Arrudas</div>
                    <div class="onda-sonora" id="visualizadorOnda">
                        <span class="barra"></span>
                        <span class="barra"></span>
                        <span class="barra"></span>
                        <span class="barra"></span>
                        <span class="barra"></span>
                    </div>
                </div>
                
                <div class="player-conteudo">
                    <button class="botao-play" id="botaoPlay">▶</button>
                    
                    <div class="barra-progresso-container">
                        <input type="range" id="barraProgresso" value="0" max="100" step="0.1">
                        <div class="tempos-info">
                            <span id="tempoAtual">00:00</span>
                            <span id="tempoTotal">00:00</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- ELEMENTO DE ÁUDIO NATIVO (FAST START) -->
    <audio id="meuAudio" preload="auto">
        <source src="https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.m4a" type="audio/mp4">
        Seu navegador não suporta elemento de áudio.
    </audio>

    <script>
        const titulo = document.getElementById("titulo");
        const escute = document.getElementById("escute");
        const avisoFone = document.getElementById("avisoFone");
        const audioPainel = document.getElementById("audioPainel");
        const fecharAudio = document.getElementById("fecharAudio");
        const botaoPlay = document.getElementById("botaoPlay");
        const audio = document.getElementById("meuAudio");
        const barraProgresso = document.getElementById("barraProgresso");
        const tempoAtual = document.getElementById("tempoAtual");
        const tempoTotal = document.getElementById("tempoTotal");
        const visualizadorOnda = document.getElementById("visualizadorOnda");

        let avisoTimer = null;

        // Abrir/Fechar menu do título
        titulo.addEventListener("click", (e) => {
            if (e.target.tagName !== "A") {
                titulo.classList.toggle("aberto");
            }
        });

        function formatarTempo(segundos) {
            if (isNaN(segundos)) return "00:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return String(min).padStart(2, "0") + ":" + String(seg).padStart(2, "0");
        }

        audio.addEventListener("loadedmetadata", () => {
            tempoTotal.textContent = formatarTempo(audio.duration);
        });

        // Ação do Botão ESCUTE
        escute.addEventListener("click", () => {
            escute.classList.add("oculto");
            audioPainel.classList.add("aberto");
            avisoFone.classList.add("visivel");

            // Toca instantaneamente aproveitando o Fast Start do R2
            audio.play().then(() => {
                botaoPlay.textContent = "❚❚";
                visualizadorOnda.classList.add("rodando");
            }).catch(err => {
                console.log("Autoplay restrito pelo navegador:", err);
            });

            // Oculta aviso de fones após 15s
            avisoTimer = setTimeout(() => {
                avisoFone.classList.remove("visivel");
            }, 15000);
        });

        // Play / Pause
        botaoPlay.addEventListener("click", () => {
            if (audio.paused) {
                audio.play();
                botaoPlay.textContent = "❚❚";
                visualizadorOnda.classList.add("rodando");
            } else {
                audio.pause();
                botaoPlay.textContent = "▶";
                visualizadorOnda.classList.remove("rodando");
            }
        });

        // Atualizar progresso
        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                const progresso = (audio.currentTime / audio.duration) * 100;
                barraProgresso.value = progresso;
                tempoAtual.textContent = formatarTempo(audio.currentTime);
            }
        });

        // Arrastar barra de progresso (Seek)
        barraProgresso.addEventListener("input", () => {
            if (audio.duration) {
                const novoTempo = (barraProgresso.value / 100) * audio.duration;
                audio.currentTime = novoTempo;
            }
        });

        // Fechar painel de áudio
        fecharAudio.addEventListener("click", () => {
            audio.pause();
            audio.currentTime = 0;
            botaoPlay.textContent = "▶";
            visualizadorOnda.classList.remove("rodando");
            audioPainel.classList.remove("aberto");
            escute.classList.remove("oculto");
            avisoFone.classList.remove("visivel");
            if (avisoTimer) clearTimeout(avisoTimer);
        });

        // Fim do áudio
        audio.addEventListener("ended", () => {
            botaoPlay.textContent = "▶";
            visualizadorOnda.classList.remove("rodando");
            audio.currentTime = 0;
        });
    </script>
</body>
</html>
