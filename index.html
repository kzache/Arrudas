
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Arrudas - Memórias Sonoras de um Território-Rio</title>

    <style>
        :root {
            --cor-arrudas: #1c4354;
            --cor-fundo: #d8d0bc;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: var(--cor-fundo);
            overflow-x: hidden;
        }

        /* MAPA DE FUNDO */
        .mapa-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .mapa-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%);
        }

        /* CAMADA DE INTERFACE */
        .interface-camada {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .interface-camada > * {
            pointer-events: auto;
        }

        /* TÍTULO DO PROJETO */
        .titulo {
            background-color: rgba(243, 240, 232, 0.94);
            padding: 20px 30px;
            border-radius: 8px;
            max-width: 450px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .titulo h1 {
            margin: 0;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: bold;
        }

        .titulo p {
            margin: 8px 0 0;
            font-size: clamp(14px, 2vw, 16px);
        }

        .menu-links {
            display: none;
            margin-top: 15px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 16px;
            padding: 5px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* CENTRO: BOTÃO ESCUTE / AVISO */
        .centro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
            text-align: center;
            gap: 20px;
        }

        .escute {
            width: 180px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(28, 67, 84, 0.25);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .escute:hover {
            transform: scale(1.05);
            background-color: rgba(28, 67, 84, 0.35);
        }

        .escute.oculto {
            display: none;
        }

        .escute img {
            width: 200px;
            height: 180px;
            object-fit: contain;
            margin-top: -30px;
        }

        .escute span {
            font-size: 24px;
            font-weight: bold;
            color: var(--cor-arrudas);
            margin-top: -85px;
            z-index: 2;
        }

        /* AVISO DE FONES */
        .aviso-fone {
            background-color: rgba(28, 67, 84, 0.9);
            color: #e8e0cf;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            max-width: 400px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
        }

        .aviso-fone.visivel {
            opacity: 1;
            visibility: visible;
        }

        .aviso-fone.oculto {
            display: none;
        }

        /* PAINEL DE ÁUDIO INFERIOR */
        .audio-painel {
            display: none;
            background-color: rgba(243, 240, 232, 0.96);
            padding: 20px;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .audio-painel.aberto {
            display: block;
        }

        .fechar-audio {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #555;
        }

        .player-conteudo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .botao-play {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: var(--cor-arrudas);
            color: #fff;
            border: none;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .barra-progresso-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--cor-arrudas);
            cursor: pointer;
        }

        .tempos-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        /* ONDA SONORA ANIMADA EM CSS (EQUALIZADOR) */
        .onda-sonora {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 22px;
            padding: 0 5px;
        }

        .onda-sonora .barra {
            width: 3px;
            height: 4px;
            background-color: #B79A78;
            border-radius: 2px;
            transition: height 0.2s ease;
        }

        .onda-sonora.rodando .barra:nth-child(1) { animation: ondaAnim 0.7s infinite ease-in-out; }
        .onda-sonora.rodando .barra:nth-child(2) { animation: ondaAnim 0.4s infinite ease-in-out 0.1s; }
        .onda-sonora.rodando .barra:nth-child(3) { animation: ondaAnim 0.6s infinite ease-in-out 0.2s; }
        .onda-sonora.rodando .barra:nth-child(4) { animation: ondaAnim 0.5s infinite ease-in-out 0.3s; }
        .onda-sonora.rodando .barra:nth-child(5) { animation: ondaAnim 0.8s infinite ease-in-out 0.4s; }

        @keyframes ondaAnim {
            0%, 100% { height: 4px; }
            50% { height: 20px; }
        }

        .player-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            padding-right: 25px;
        }

        /* AJUSTES PARA TELAS PEQUENAS */
        @media (max-width: 600px) {
            .interface-camada {
                padding: 15px;
            }
            .titulo {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- MAPA AO FUNDO -->
    <div class="mapa-container">
        <iframe src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=true"></iframe>
    </div>

    <!-- INTERFACE -->
    <div class="interface-camada">
        
        <!-- CABEÇALHO / TÍTULO -->
        <div class="titulo" id="titulo">
            <h1>ARRUDAS</h1>
            <p>Memórias Sonoras de um Território-Rio</p>
            <div class="menu-links">
                <a href="sobre.html">Sobre o projeto</a>
            </div>
        </div>

        <!-- CENTRO -->
        <div class="centro-container">
            <button class="escute" id="escute">
                <img src="orelha.png" alt="Orelha">
                <span>ESCUTE</span>
            </button>

            <div class="aviso-fone" id="avisoFone">
                Para uma experiência sonora imersiva, use fones de ouvido.
            </div>
        </div>

        <!-- PAINEL DE ÁUDIO -->
        <div class="audio-painel" id="audioPainel">
            <button class="fechar-audio" id="fecharAudio">×</button>
            
            <div class="player-topo">
                <div style="font-weight: bold; font-size: 15px;">Peça Sonora - Arrudas</div>
                <!-- Onda sonora animada -->
                <div class="onda-sonora" id="visualizadorOnda">
                    <span class="barra"></span>
                    <span class="barra"></span>
                    <span class="barra"></span>
                    <span class="barra"></span>
                    <span class="barra"></span>
                </div>
            </div>
            
            <div class="player-conteudo">
                <button class="botao-play" id="botaoPlay">▶</button>
                
                <div class="barra-progresso-container">
                    <input type="range" id="barraProgresso" value="0" max="100" step="0.1">
                    <div class="tempos-info">
                        <span id="tempoAtual">00:00</span>
                        <span id="tempoTotal">00:00</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ELEMENTO DE ÁUDIO NATIVO -->
    <audio id="meuAudio" preload="auto">
        <source src="https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.m4a" type="audio/mp4">
        Seu navegador não suporta elemento de áudio.
    </audio>

    <script>
        const titulo = document.getElementById("titulo");
        const escute = document.getElementById("escute");
        const avisoFone = document.getElementById("avisoFone");
        const audioPainel = document.getElementById("audioPainel");
        const fecharAudio = document.getElementById("fecharAudio");
        const botaoPlay = document.getElementById("botaoPlay");
        const audio = document.getElementById("meuAudio");
        const barraProgresso = document.getElementById("barraProgresso");
        const tempoAtual = document.getElementById("tempoAtual");
        const tempoTotal = document.getElementById("tempoTotal");
        const visualizadorOnda = document.getElementById("visualizadorOnda");

        let avisoTimer = null;

        titulo.addEventListener("click", (e) => {
            if (e.target.tagName !== "A") {
                titulo.classList.toggle("aberto");
            }
        });

        function formatarTempo(segundos) {
            if (isNaN(segundos)) return "00:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return String(min).padStart(2, "0") + ":" + String(seg).padStart(2, "0");
        }

        audio.addEventListener("loadedmetadata", () => {
            tempoTotal.textContent = formatarTempo(audio.duration);
        });

        escute.addEventListener("click", () => {
            escute.classList.add("oculto");
            audioPainel.classList.add("aberto");
            avisoFone.classList.add("visivel");

            audio.play().then(() => {
                botaoPlay.textContent = "❚❚";
                visualizadorOnda.classList.add("rodando");
            }).catch(err => {
                console.log("Autoplay restrito:", err);
            });

            avisoTimer = setTimeout(() => {
                avisoFone.classList.remove("visivel");
                avisoFone.classList.add("oculto");
            }, 15000);
        });

        botaoPlay.addEventListener("click", () => {
            if (audio.paused) {
                audio.play();
                botaoPlay.textContent = "❚❚";
                visualizadorOnda.classList.add("rodando");
            } else {
                audio.pause();
                botaoPlay.textContent = "▶";
                visualizadorOnda.classList.remove("rodando");
            }
        });

        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                const progresso = (audio.currentTime / audio.duration) * 100;
                barraProgresso.value = progresso;
                tempoAtual.textContent = formatarTempo(audio.currentTime);
            }
        });

        barraProgresso.addEventListener("input", () => {
            if (audio.duration) {
                const novoTempo = (barraProgresso.value / 100) * audio.duration;
                audio.currentTime = novoTempo;
            }
        });

        fecharAudio.addEventListener("click", () => {
            audio.pause();
            audio.currentTime = 0;
            botaoPlay.textContent = "▶";
            visualizadorOnda.classList.remove("rodando");
            audioPainel.classList.remove("aberto");
            escute.classList.remove("oculto");
            avisoFone.classList.remove("visivel", "oculto");
            if (avisoTimer) clearTimeout(avisoTimer);
        });

        audio.addEventListener("ended", () => {
            botaoPlay.textContent = "▶";
            visualizadorOnda.classList.remove("rodando");
            audio.currentTime = 0;
        });
    </script>
</body>
</html>
