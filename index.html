
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Arrudas - Memórias Sonoras de um Território-Rio</title>

    <style>
        :root {
            --cor-arrudas: #1c4354;
            --cor-fundo: #d8d0bc;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", monospace;
            color: #222;
            background-color: var(--cor-fundo);
        }

        /* CONTAINER GLOBAL ESTÁVEL */
        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--cor-fundo);
        }

        /* MAPA DE FUNDO FIXO */
        .mapa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .mapa iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
            filter: sepia(75%) saturate(65%) brightness(90%) contrast(95%);
        }

        /* DESENHO DO ARRUDAS SOBREPOSTO */
        .desenho-arrudas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: entradaDesenho 2s ease-out 1s forwards;
            background-image: linear-gradient(
                45deg,
                #651b28,
                var(--cor-arrudas)
            );
            -webkit-mask-image: url("desenho_mapa.svg");
            mask-image: url("desenho_mapa.svg");
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: contain;
            mask-size: contain;
        }

        @keyframes entradaDesenho {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* CAMADA DE INTERFACE (UI) FLUIDA */
        .interface-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4vw;
        }

        .interface-ui > * {
            pointer-events: auto;
        }

        /* TÍTULO NO CANTO SUPERIOR ESQUERDO */
        .titulo {
            background-color: rgba(243, 240, 232, 0.94);
            padding: 20px 30px;
            border-radius: 8px;
            max-width: 420px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            align-self: flex-start;
        }

        .titulo h1 {
            margin: 0;
            font-size: clamp(22px, 3vw, 36px);
            font-weight: bold;
        }

        .titulo p {
            margin: 8px 0 0;
            font-size: clamp(13px, 1.5vw, 18px);
        }

        .menu-links {
            display: none;
            margin-top: 15px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }

        .titulo.aberto .menu-links {
            display: block;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            color: #222;
            font-size: 18px;
            padding: 5px 0;
        }

        .menu-links a:hover {
            text-decoration: underline;
        }

        /* CENTRO: BOTÃO ESCUTE E AVISO */
        .centro-acao {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        .escute {
            width: 170px;
            height: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(28, 67, 84, 0.25);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease, opacity 0.8s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .escute:hover {
            transform: scale(1.05);
            background-color: rgba(28, 67, 84, 0.35);
        }

        .escute.oculto {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .escute img {
            width: 200px;
            height: 180px;
            object-fit: contain;
            margin-top: -25px;
        }

        .escute span {
            font-size: 26px;
            font-weight: bold;
            color: var(--cor-arrudas);
            margin-top: -85px;
            z-index: 2;
        }

        /* AVISO DE FONES */
        .aviso-fone {
            background-color: rgba(28, 67, 84, 0.9);
            color: #e8e0cf;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
        }

        .aviso-fone.visivel {
            opacity: 1;
            visibility: visible;
        }

        /* PAINEL DE ÁUDIO INFERIOR (COM ONDA SONORA REAL INTERATIVA) */
        .audio-painel {
            position: absolute;
            bottom: 4vh;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: transparent;
            width: 90%;
            max-width: 650px;
            padding: 10px;
        }

        .audio-painel.aberto {
            display: block;
        }

        .player-flex {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: rgba(243, 240, 232, 0.94);
            backdrop-filter: blur(5px);
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            position: relative;
        }

        .botao-play {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--cor-arrudas);
            color: #fff;
            border: none;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .waveform-container {
            flex-grow: 1;
            position: relative;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* ONDA SONORA DE FUNDO INTERATIVA */
        .waveform-bg {
            position: absolute;
            width: 100%;
            height: 35px;
            background-image: repeating-linear-gradient(
                90deg,
                #B79A78,
                #B79A78 3px,
                transparent 3px,
                transparent 7px
            );
            mask-image: linear-gradient(90deg, #000 20%, #666 50%, #000 80%, #444 100%);
            -webkit-mask-image: linear-gradient(90deg, #000 20%, #666 50%, #000 80%, #444 100%);
        }

        .progresso-onda {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background-color: var(--cor-arrudas);
            opacity: 0.35;
            pointer-events: none;
            border-radius: 4px;
        }

        input[type="range"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
        }

        .fechar-audio {
            position: absolute;
            top: -15px;
            right: 0;
            background: rgba(243, 240, 232, 0.95);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            color: #222;
        }

        .tempos-info {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            min-width: 45px;
            text-align: right;
        }

        /* AJUSTES ESPECÍFICOS PARA DISPOSITIVOS MÓVEIS */
        @media (max-width: 768px) {
            .interface-ui {
                padding: 15px;
            }
            .titulo {
                padding: 12px 18px;
            }
            .titulo h1 { font-size: 20px; }
            .titulo p { font-size: 12px; }

            .escute {
                width: 150px;
                height: 150px;
            }
            .escute img {
                width: 170px;
                height: 150px;
            }
            .escute span {
                font-size: 22px;
                margin-top: -75px;
            }
            .player-flex {
                padding: 12px 18px;
                border-radius: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- MAPA LIMPO (Sem controles extras do Umap) -->
        <div class="mapa">
            <iframe src="//umap.openstreetmap.fr/pt-br/map/mapa_1471708?scaleControl=false&miniMapControl=false&scrollWheelZoom=true&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false&onLoadPanel=none&captionBar=false&captionMenus=false&fullscreenControl=false&locateControl=false&captionControl=false&printControl=false&measureControl=false&dragging=true"></iframe>
        </div>

        <!-- DESENHO ARTÍSTICO DO ARRUDAS -->
        <div class="desenho-arrudas" aria-hidden="true"></div>

        <!-- INTERFACE FLUIDA -->
        <div class="interface-ui">
            
            <!-- TÍTULO -->
            <div class="titulo" id="titulo">
                <h1>ARRUDAS</h1>
                <p>Memórias Sonoras de um Território-Rio</p>
                <div class="menu-links">
                    <a href="sobre.html">Sobre o projeto</a>
                </div>
            </div>

            <!-- CENTRO -->
            <div class="centro-acao">
                <button class="escute" id="escute">
                    <img src="orelha.png" alt="Orelha">
                    <span>ESCUTE</span>
                </button>

                <div class="aviso-fone" id="avisoFone">
                    Para uma experiência sonora imersiva, use fones de ouvido.
                </div>
            </div>

            <!-- PLAYER INFERIOR COM ONDA SONORA -->
            <div class="audio-painel" id="audioPainel">
                <button class="fechar-audio" id="fecharAudio">×</button>
                
                <div class="player-flex">
                    <button class="botao-play" id="botaoPlay">▶</button>
                    
                    <div class="waveform-container" id="waveformContainer">
                        <div class="waveform-bg"></div>
                        <div class="progresso-onda" id="progressoOnda"></div>
                        <input type="range" id="barraProgresso" value="0" max="100" step="0.1">
                    </div>

                    <div class="tempos-info" id="tempoAtual">00:00</div>
                </div>
            </div>

        </div>

    </div>

    <!-- ÁUDIO NATIVO COM STREAMING RÁPIDO -->
    <audio id="meuAudio" preload="auto">
        <source src="https://pub-0c523da3e80b4a0ab591837050bc71cb.r2.dev/arrudas_peca_sonora.m4a" type="audio/mp4">
        Seu navegador não suporta elemento de áudio.
    </audio>

    <script>
        const titulo = document.getElementById("titulo");
        const escute = document.getElementById("escute");
        const avisoFone = document.getElementById("avisoFone");
        const audioPainel = document.getElementById("audioPainel");
        const fecharAudio = document.getElementById("fecharAudio");
        const botaoPlay = document.getElementById("botaoPlay");
        const audio = document.getElementById("meuAudio");
        const barraProgresso = document.getElementById("barraProgresso");
        const progressoOnda = document.getElementById("progressoOnda");
        const tempoAtual = document.getElementById("tempoAtual");

        let avisoTimer = null;

        titulo.addEventListener("click", (e) => {
            if (e.target.tagName !== "A") {
                titulo.classList.toggle("aberto");
            }
        });

        function formatarTempo(segundos) {
            if (isNaN(segundos)) return "00:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return String(min).padStart(2, "0") + ":" + String(seg).padStart(2, "0");
        }

        escute.addEventListener("click", () => {
            escute.classList.add("oculto");
            audioPainel.classList.add("aberto");
            avisoFone.classList.add("visivel");

            audio.play().then(() => {
                botaoPlay.textContent = "❚❚";
            }).catch(err => {
                console.log("Autoplay restrito:", err);
            });

            avisoTimer = setTimeout(() => {
                avisoFone.classList.remove("visivel");
            }, 15000);
        });

        botaoPlay.addEventListener("click", () => {
            if (audio.paused) {
                audio.play();
                botaoPlay.textContent = "❚❚";
            } else {
                audio.pause();
                botaoPlay.textContent = "▶";
            }
        });

        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                const progresso = (audio.currentTime / audio.duration) * 100;
                barraProgresso.value = progresso;
                progressoOnda.style.width = progresso + "%";
                tempoAtual.textContent = formatarTempo(audio.currentTime);
            }
        });

        barraProgresso.addEventListener("input", () => {
            if (audio.duration) {
                const novoTempo = (barraProgresso.value / 100) * audio.duration;
                audio.currentTime = novoTempo;
                progressoOnda.style.width = barraProgresso.value + "%";
            }
        });

        fecharAudio.addEventListener("click", () => {
            audio.pause();
            audio.currentTime = 0;
            botaoPlay.textContent = "▶";
            progressoOnda.style.width = "0%";
            audioPainel.classList.remove("aberto");
            escute.classList.remove("oculto");
            avisoFone.classList.remove("visivel");
            if (avisoTimer) clearTimeout(avisoTimer);
        });

        audio.addEventListener("ended", () => {
            botaoPlay.textContent = "▶";
            progressoOnda.style.width = "0%";
            audio.currentTime = 0;
        });
    </script>
</body>
</html>
